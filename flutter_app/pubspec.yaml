name: mensaena
description: Mensaena – Nachbarschaftshilfe-App. 1:1 Spiegel der Webseite www.mensaena.de.
publish_to: 'none'
version: 4.4.4+40404

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Backend
  supabase_flutter: ^2.5.6

  # Routing
  go_router: ^14.2.0

  # Karte (OpenStreetMap, nicht Google Maps)
  flutter_map: ^7.0.1
  flutter_map_marker_cluster: ^1.3.6
  latlong2: ^0.9.1
  flutter_map_tile_caching: ^9.0.0

  # Echtzeit-Voice/Video — funktioniert mit Patch via
  # `scripts/patch_flutter_webrtc.sh` (Flutter 3.27 TextureRegistry-Bug)
  livekit_client: 2.4.3
  # Runtime-Permissions (Mic/Cam fuer Calls + Livestreams)
  permission_handler: ^11.3.0

  # Voice-Messages — 1:1 zu Web VoiceRecorder.tsx
  # record: Audio aufnehmen (AAC m4a), audioplayers: Wiedergabe in Chat-Bubble.
  # Pinned auf 5.0.5: 5.1+ pulls broken record_linux 0.7.2 mit fehlendem
  # startStream-Override, das Android-Build laesst sich nicht kompilieren.
  record: 5.0.5
  audioplayers: ^6.0.0
  # F52 Vorlesefunktion war hier (flutter_tts ^4.2.0) — entfernt weil
  # die 4.x-Plugin-Releases mit Kotlin 2.2 Metadata kompiliert sind,
  # während Flutters bundled Kotlin-Compiler noch 1.9 ist. CI bricht
  # mit "metadata version 2.2.0 vs compiler 1.9.0". Vorlesefunktion
  # kommt zurück sobald Flutter-SDK auf Kotlin 2.x springt oder ein
  # pinned 3.x-Release wieder buildable ist.

  # Push Notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Lokale Notifications fuer FCM-Foreground + Background-Data-Messages
  # (data-only Pushes muessen vom Client als sichtbare Notification angezeigt
  # werden, sonst nur stille Updates → kein User-Feedback bei geschlossener App).
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Fonts (Inter, Fraunces, Instrument Serif, JetBrains Mono)
  google_fonts: ^6.2.1

  # Icons (Web-konsistent)
  lucide_icons: ^0.257.0

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  # HTML-Render für die E-Mail-Vorschau im Marketing-Admin (pure Dart, kein
  # natives Webview → keine Plattform-Konfig nötig).
  flutter_widget_from_html_core: ^0.16.0

  # Geo
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Utils
  intl: '>=0.19.0 <1.0.0'
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  # Deep-Links: fängt eingehende mensaena.de-Links nativ ab und reicht
  # sie an den DeepLinkService → GoRouter weiter.
  app_links: ^6.3.0
  # Device-Tier-Detection: ARM-ABI, SDK-Version, ggf. Hersteller — Grundlage
  # für den Lite-Mode auf alten Geräten (Cinema-Effekte/Animationen aus).
  device_info_plus: ^11.3.0
  flutter_secure_storage: ^9.2.2
  package_info_plus: ^8.0.0
  qr_flutter: ^4.1.0
  shimmer: ^3.0.0
  connectivity_plus: ^6.0.5
  flutter_markdown: ^0.7.3
  crypto: ^3.0.5

  # i18n — JSON-basierte Übersetzungen für DE/EN/IT/ES/RU/TR/FR.
  # Auto-Detection via geocoding (Country-Code → primary language).
  easy_localization: ^3.0.7

  # Barcode/QR-Scanner — Marketplace (Open Food Facts Lookup) + Org-Invites.
  mobile_scanner: ^5.2.3
  # Voice-Diktat im Chat-Composer + Create-Flows (Accessibility).
  speech_to_text: ^7.0.0
  # ICS-Kalender-Export für Events.
  add_2_calendar: ^3.0.1
  # Shake-to-Report: User schüttelt Phone → Screenshot + Annotation → error_logs.
  feedback: ^3.1.0

  # Splash-/Backdrop-Loop-Videos (Higgsfield-Assets, stumm, lokal
  # gebuendelt). Nur auf EffectsProfile.full aktiv — reduced/none nutzt
  # das frame-identische Standbild via CinematicBackdrop.
  video_player: ^2.9.2

  # Shorebird OTA: liest die Patch-Nummer + meldet sich beim Server.
  # Patches selber werden automatisch beim Launch installiert.
  shorebird_code_push: ^2.0.6

  # In-App APK-Download + Install (Pflicht-Updates):
  # http fuer Stream-Download mit Progress, path_provider fuer Temp-Pfad,
  # open_filex fuer PackageInstaller-Intent (Android REQUEST_INSTALL_PACKAGES
  # ist in AndroidManifest schon gesetzt).
  http: ^1.2.2
  path_provider: ^2.1.5
  open_filex: ^4.5.0

  # Phase 4 Mega-Wave Dependencies (alle aktiv genutzt, siehe Services):
  # skeletonizer — Auto-Skeleton-Loading aus echten Widgets (F7)
  skeletonizer: ^1.4.0
  # confetti — Konfetti bei Streak/Achievement/Post-Erstellen (F4/F38)
  confetti: ^0.7.0
  # sentiment_dart — Offline Sentiment-Analyse fuer Post-Moderation (F23/F35)
  sentiment_dart: ^0.0.5
  # local_auth — Fingerprint/Face-ID Login (F15)
  local_auth: ^2.3.0
  # tutorial_coach_mark — Spotlight-Onboarding-Tour (F18)
  tutorial_coach_mark: ^1.3.3

  # XML-Parsing fuer MeteoAlarm Atom-Feeds (EU-Wetterwarnungen).
  xml: ^6.5.0

  # Accelerometer/Gyroscope fuer 3D-Tilt-Cards (Cinematic Phase B).
  sensors_plus: ^6.0.1

  # WhatsApp-Style native Call-UI (Lock-Screen + Fullscreen Ringing).
  # Auch im Background/Killed-State zeigt Android das native CallScreen
  # statt einer Heads-Up-Notification.
  flutter_callkit_incoming: ^2.5.4
  # System-Overlay (SYSTEM_ALERT_WINDOW) — zeichnet unsere eigene Vollbild-
  # Anruf-UI über jede App / das Sperrbildschirm-System, weil Samsung One UI
  # ab Android 14 fullScreenIntent auf Heads-up degradiert sobald entsperrt.
  flutter_overlay_window: ^0.4.5
  # Android-Intent: erlaubt dem Overlay-Isolate MainActivity per Intent in den
  # Vordergrund zu holen, wenn der User dort auf Annehmen tippt (sonst landet
  # die Annahme nicht im Main-Isolate weil das im killed-State war).
  android_intent_plus: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.1

# record 5.x pulls record_linux 0.7.2 (Dart-Compile-Error: fehlende
# startStream-Override). Force record_platform_interface zur Version die
# record_linux 0.7.2 erwartet (Pre-1.6 ohne startStream). Android-Build
# kompiliert nicht record_linux.dart sondern nur record_android — alles ok.
dependency_overrides:
  record_platform_interface: 1.1.0

# Generiert die Android-Launcher-Icons aus assets/launcher/icon.png.
# Aufruf in CI nach `flutter pub get`:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/launcher/icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#0A0F1C"
  adaptive_icon_foreground: "assets/launcher/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Unterverzeichnis MUSS explizit deklariert werden — `assets/images/`
    # bündelt KEINE Unterordner. Sonst fehlen die Modul-Header-Banner.
    - assets/images/modules/
    - assets/launcher/
    - assets/translations/
    - assets/data/
    - assets/sounds/
    - assets/videos/
    # WICHTIG: shorebird.yaml MUSS als Asset gebündelt sein — sonst schlägt
    # `shorebird release`/`patch` mit "pubspec.yaml does not have shorebird.yaml
    # as a flutter asset" fehl.
    - shorebird.yaml
  shaders:
    - shaders/grain.frag
