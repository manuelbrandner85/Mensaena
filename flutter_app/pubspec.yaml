name: mensaena
description: Mensaena – Nachbarschaftshilfe-App. 1:1 Spiegel der Webseite www.mensaena.de.
publish_to: 'none'
version: 4.0.0+40000

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Backend
  supabase_flutter: ^2.5.6

  # Routing
  go_router: ^14.2.0

  # Karte (OpenStreetMap, nicht Google Maps)
  flutter_map: ^7.0.1
  flutter_map_marker_cluster: ^1.3.6
  latlong2: ^0.9.1

  # Echtzeit-Voice/Video — re-added in Phase 6 wenn flutter_webrtc upstream
  # fix fuer Flutter 3.27 TextureRegistry.SurfaceProducer.Callback Bug
  # released hat. Aktuelle 0.14.x hat den Bug immer noch (anonymous class
  # implementiert onSurfaceDestroyed() nicht).
  # livekit_client: 2.4.3

  # Push Notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Fonts (Inter, Fraunces, Instrument Serif, JetBrains Mono)
  google_fonts: ^6.2.1

  # Icons (Web-konsistent)
  lucide_icons: ^0.257.0

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # Geo
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Utils
  intl: '>=0.19.0 <1.0.0'
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  flutter_secure_storage: ^9.2.2
  package_info_plus: ^8.0.0
  qr_flutter: ^4.1.0
  shimmer: ^3.0.0
  connectivity_plus: ^6.0.5
  flutter_markdown: ^0.7.3
  crypto: ^3.0.5

  # Shorebird OTA: liest die Patch-Nummer + meldet sich beim Server.
  # Patches selber werden automatisch beim Launch installiert.
  shorebird_code_push: ^2.0.6

  # In-App APK-Download + Install (Pflicht-Updates):
  # http fuer Stream-Download mit Progress, path_provider fuer Temp-Pfad,
  # open_filex fuer PackageInstaller-Intent (Android REQUEST_INSTALL_PACKAGES
  # ist in AndroidManifest schon gesetzt).
  http: ^1.2.2
  path_provider: ^2.1.5
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.1

# Generiert die Android-Launcher-Icons aus assets/launcher/icon.png.
# Aufruf in CI nach `flutter pub get`:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/launcher/icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#0A0F1C"
  adaptive_icon_foreground: "assets/launcher/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/launcher/
