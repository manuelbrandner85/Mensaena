name: Migration Guard

# Fängt doppelte Migrations-Timestamps früh im PR ab. Zwei Dateien mit
# demselben numerischen Versions-Prefix lassen `supabase db push` mit
# SQLSTATE 23505 (duplicate key) rot fehlen und brechen den Main-Deploy
# (so geschehen am 2026-06-24). Dieser Check läuft VOR dem Merge.

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/check_migration_timestamps.py'
      - '.github/workflows/check_migrations.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'

permissions:
  contents: read

jobs:
  check-timestamps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Guard — keine doppelten Migrations-Timestamps
        run: python3 scripts/check_migration_timestamps.py
