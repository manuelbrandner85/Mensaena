name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GITHUB_TOKEN braucht read-only contents-Permission fuer actions/checkout@v4,
# sonst schlaegt das interne post-clone fetch mit "could not read Username
# for 'https://github.com': terminal prompts disabled" fehl, wenn die Org
# GITHUB_TOKEN-Default-Permissions auf "no permissions" gesetzt hat.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 holt die volle History in einem einzigen Clone —
          # umgeht den Second-Fetch-Bug in actions/checkout@v4, der bei
          # bestimmten Org-Token-Konfigurationen das Credential verliert
          # ("could not read Username for https://github.com").
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # Retry bei transient network issues (z.B. sharp/libvips binary download
        # timeouts via @capacitor/assets). Bis zu 3 Versuche mit 20s Pause.
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              echo "::notice::npm ci succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning::npm ci failed (attempt $attempt/3) – retrying in 20s"
            rm -rf node_modules
            sleep 20
          done
          echo "::error::npm ci failed after 3 attempts"
          exit 1

      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://huaqldjkgyosefzfhjnf.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1YXFsZGprZ3lvc2VmemZoam5mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5ODcxMTgsImV4cCI6MjA5MDU2MzExOH0.Q5ciM8f--f1xAsKyr9-hv1mz7GGbJ6vbxPe4Cj5mgYE
          NEXT_PUBLIC_APP_NAME: Mensaena
          NEXT_PUBLIC_APP_URL: https://www.mensaena.de
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Validate Cloudflare token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error title=Missing secret::CLOUDFLARE_API_TOKEN fehlt (Repo → Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        # account_id ist in wrangler.toml gesetzt –
        # open-next.config.ts wird umbenannt damit wrangler 4.x das Projekt NICHT als
        # OpenNext erkennt und opennextjs-cloudflare deploy aufruft (→ edge-preview 10000).
        run: |
          mv open-next.config.ts _open-next.config.ts.ci-skip
          npx wrangler deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
