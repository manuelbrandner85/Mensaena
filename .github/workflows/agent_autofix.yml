name: 🔧 Agent Auto-Fix (rotes CI)

# ════════════════════════════════════════════════════════════════════════
# Wenn das Flutter-CI eines Agent-PRs (Branch agent/task-*) ROT wird, liest
# dieser Workflow das Fehler-Log, lässt die Claude Code CLI den Fehler beheben
# und pusht den Fix auf denselben Branch → CI läuft erneut. Ziel: im besten
# Fall wird das CI grün, agent_automerge.yml merged automatisch und der
# Shorebird-OTA-Patch macht die Änderung in der App aktiv.
#
# Begrenzung: max. 3 automatische Versuche (admin_dev_tasks.ci_attempts).
# Danach bleibt der PR offen zur manuellen Prüfung.
#
# Secrets: AGENT_PAT, CLAUDE_CODE_OAUTH_TOKEN | ANTHROPIC_API_KEY,
#          SUPABASE_SERVICE_ROLE_KEY.
# ════════════════════════════════════════════════════════════════════════

on:
  workflow_run:
    workflows: ["Flutter Android Build"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  SUPABASE_REF: gyqujitkvymlmgroovch
  AGENT_MODEL: claude-sonnet-4-6
  SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  MAX_ATTEMPTS: 3

jobs:
  autofix:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'agent/task-') &&
      github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Checkout Agent-Branch (mit PAT)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_PAT }}
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Versuchszähler prüfen
        id: gate
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          TASK_ID="${BRANCH#agent/task-}"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          # aktuellen ci_attempts-Stand lesen
          ATTEMPTS=$(curl -sS \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_dev_tasks?id=eq.${TASK_ID}&select=ci_attempts,instruction" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}")
          CUR=$(node -e 'const a=JSON.parse(process.argv[1]); process.stdout.write(String((a[0]&&a[0].ci_attempts)||0))' "$ATTEMPTS")
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          node -e 'const a=JSON.parse(process.argv[1]); process.stdout.write((a[0]&&a[0].instruction)||"")' "$ATTEMPTS" > /tmp/instruction.txt
          if [ "$CUR" -ge "$MAX_ATTEMPTS" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-Fix erschöpft → PR offen lassen
        if: steps.gate.outputs.proceed == 'false'
        run: |
          TASK_ID="${{ steps.gate.outputs.task_id }}"
          curl -sS -X PATCH \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_dev_tasks?id=eq.${TASK_ID}" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"ci_status\":\"failure\",\"summary\":\"Auto-Fix nach ${MAX_ATTEMPTS} Versuchen erschöpft — PR bleibt offen zur manuellen Prüfung.\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"

      - name: Setup Node
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: CI-Fehler-Log holen
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --repo "${{ github.repository }}" --log-failed > /tmp/ci_fail.log 2>&1 || true
          # Nur die letzten 300 Zeilen sind relevant (Fehlermeldungen am Ende).
          tail -n 300 /tmp/ci_fail.log > /tmp/ci_fail_tail.log || true
          echo "Log-Zeilen: $(wc -l < /tmp/ci_fail_tail.log 2>/dev/null || echo 0)"

      - name: Claude Code CLI installieren
        if: steps.gate.outputs.proceed == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Status -> running (Auto-Fix)
        if: steps.gate.outputs.proceed == 'true'
        run: |
          TASK_ID="${{ steps.gate.outputs.task_id }}"
          NEXT=$(( ${{ steps.gate.outputs.current }} + 1 ))
          curl -sS -X PATCH \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_dev_tasks?id=eq.${TASK_ID}" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"status\":\"running\",\"ci_status\":\"running\",\"ci_attempts\":${NEXT},\"summary\":\"Auto-Fix Versuch ${NEXT}/${MAX_ATTEMPTS} läuft …\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"

      - name: Fix-Prompt schreiben
        if: steps.gate.outputs.proceed == 'true'
        run: |
          {
            echo "Du bist der Mensaena-Reparatur-Agent. Das Flutter-CI für deinen"
            echo "letzten Commit ist FEHLGESCHLAGEN. Behebe die Ursache, damit das CI"
            echo "grün wird. Ändere nur, was nötig ist."
            echo ""
            echo "=== URSPRÜNGLICHE AUFGABE ==="
            cat /tmp/instruction.txt
            echo ""
            echo "=== CI-FEHLER-LOG (Auszug) ==="
            cat /tmp/ci_fail_tail.log
            echo "=== ENDE LOG ==="
            echo ""
            echo "Regeln:"
            echo "- Befolge CLAUDE.md (i18n-Pflicht in ALLEN 7 JSON-Dateien,"
            echo "  Supabase-Stream-Limits mit .limit()+autoDispose, Design teal/primary,"
            echo "  KEINE emerald-Farben)."
            echo "- Typische Fehler: fehlende Imports, erfundene LucideIcons, falsche"
            echo "  Typen, fehlende .tr()-Keys, Analyzer-Warnungen als Fehler."
            echo "- Der Code MUSS kompilieren ('flutter analyze' sauber)."
            echo "- Committe/pushe NICHT selbst — das übernimmt der Workflow."
          } > /tmp/fix_prompt.txt

      - name: Auto-Fix ausführen
        if: steps.gate.outputs.proceed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          claude -p "$(cat /tmp/fix_prompt.txt)" \
            --model "$AGENT_MODEL" \
            --dangerously-skip-permissions \
            --max-turns 60 \
            > /tmp/fix_output.log 2>&1
          echo "Exit: $?"
          tail -n 40 /tmp/fix_output.log || true

      - name: Fix committen & pushen
        if: steps.gate.outputs.proceed == 'true'
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          TASK_ID="${{ steps.gate.outputs.task_id }}"
          NEXT=$(( ${{ steps.gate.outputs.current }} + 1 ))
          git config user.name "Mensaena Agent"
          git config user.email "agent@mensaena.de"
          if git diff --quiet && git diff --cached --quiet; then
            echo "Auto-Fix hat keine Änderung erzeugt."
            curl -sS -X PATCH \
              "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_dev_tasks?id=eq.${TASK_ID}" \
              -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
              -H "Content-Type: application/json" -H "Prefer: return=minimal" \
              -d "{\"ci_status\":\"failure\",\"summary\":\"Auto-Fix Versuch ${NEXT}: keine Änderung möglich — PR bleibt offen.\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"
            exit 0
          fi
          git add -A
          git commit -m "agent: Auto-Fix CI #${TASK_ID} (Versuch ${NEXT})"
          git push origin "HEAD:${BRANCH}"
