name: 🔎 Admin Deep Scan

# ════════════════════════════════════════════════════════════════════════
# Tiefenanalyse der GESAMTEN App. Wird vom Admin-Dashboard via Edge Function
# `admin-dev-suggestions` (action='scan') getriggert. Die Claude Code CLI liest
# den kompletten Code (jeden Screen, jedes Detail) und meldet konkrete
# Vorschläge — logische Fehler, Bugs, UI/UX-Verbesserungen, Performance,
# i18n-Lücken, Sicherheits-/Datenbankprobleme — als JSON. Diese werden in
# admin_dev_suggestions geschrieben; der Admin nimmt sie im Dashboard an
# (→ admin_dev_tasks → PR → OTA) oder lehnt sie ab.
#
# WICHTIG: Dieser Workflow ändert KEINEN Code und erstellt KEINEN PR. Er
# analysiert nur und schreibt Vorschläge. Das Umsetzen passiert erst nach
# Annahme durch den Admin (admin_agent.yml).
#
# Benötigte GitHub Secrets:
#   CLAUDE_CODE_OAUTH_TOKEN ODER ANTHROPIC_API_KEY  — für die Claude Code CLI
#   SUPABASE_SERVICE_ROLE_KEY                        — Vorschläge schreiben
#
# Hinweis: scan_id wird AUSSCHLIESSLICH über Umgebungsvariablen genutzt —
# niemals via ${{ }}-Interpolation in run-Blöcken (Script-Injection-Schutz).
# ════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      scan_id:
        description: 'admin_scan_runs.id (UUID)'
        required: true
  # Automatischer Cron-Scan: alle 30 Min, 12:00–18:00 Uhr deutscher Zeit.
  # GitHub-Cron läuft in UTC ohne Sommer-/Winterzeit → fest auf Sommer (CEST,
  # UTC+2): 10:00–16:00 UTC = 12:00–18:00 Uhr lokal. Im Winter (CET) verschiebt
  # sich das Fenster lokal auf 11:00–17:00 Uhr.
  schedule:
    - cron: '0,30 10-15 * * *'  # 12:00–17:30 Uhr lokal (Sommer)
    - cron: '0 16 * * *'        # 18:00 Uhr lokal (Sommer)

permissions:
  contents: read

env:
  SUPABASE_REF: gyqujitkvymlmgroovch
  AGENT_MODEL: claude-opus-4-8
  SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SCAN_ID: ${{ inputs.scan_id }}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Bei Cron-Trigger gibt es keine vorab angelegte scan_id (die kommt sonst
      # von der Edge Function). Wir legen die admin_scan_runs-Zeile hier selbst
      # via service_role an. Wenn bereits ein Scan läuft (queued/running),
      # überspringen wir lautlos, um Doppel-Scans/Kosten zu vermeiden.
      - name: Cron-Scan vorbereiten (scan_run anlegen)
        if: github.event_name == 'schedule'
        run: |
          # Nur kürzlich aktualisierte Runs zählen als aktiv — verwaiste
          # "running"-Zeilen (abgestürzter Runner) älter als 2 h ignorieren,
          # sonst würde ein Steckenbleiber alle künftigen Cron-Scans blockieren.
          STALE=$(date -u -d '2 hours ago' +%FT%TZ)
          ACTIVE=$(curl -sS \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_scan_runs?select=id&status=in.(queued,running)&updated_at=gt.${STALE}&limit=1" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).length))}catch{process.stdout.write("0")}})')
          if [ "$ACTIVE" != "0" ]; then
            echo "Es läuft bereits ein Deep-Scan — Cron-Lauf wird übersprungen."
            echo "SKIP_SCAN=1" >> "$GITHUB_ENV"
            exit 0
          fi
          NEW_ID=$(curl -sS -X POST \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_scan_runs" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            -H "Content-Type: application/json" -H "Prefer: return=representation" \
            -d "{\"status\":\"queued\"}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s)[0].id)}catch{process.stdout.write("")}})')
          if [ -z "$NEW_ID" ]; then
            echo "Konnte keine scan_run-Zeile anlegen."; exit 1
          fi
          echo "Cron-Scan angelegt: $NEW_ID"
          echo "SCAN_ID=$NEW_ID" >> "$GITHUB_ENV"

      - name: Status -> running
        if: env.SKIP_SCAN != '1'
        run: |
          curl -sS -X PATCH \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_scan_runs?id=eq.${SCAN_ID}" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"status\":\"running\",\"phase\":\"scanning\",\"analyzed_files\":0,\"found_so_far\":0,\"heartbeat_at\":\"$(date -u +%FT%TZ)\",\"run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"

      - name: Setup Node
        if: env.SKIP_SCAN != '1'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Claude Code CLI installieren
        if: env.SKIP_SCAN != '1'
        run: npm install -g @anthropic-ai/claude-code

      - name: Analyse-Prompt schreiben
        if: env.SKIP_SCAN != '1'
        run: |
          {
            echo "Du bist der Mensaena-Qualitäts-Analyst. Analysiere die GESAMTE"
            echo "Flutter-App unter flutter_app/lib/ — JEDEN Screen, jedes Widget,"
            echo "jedes Repository, jeden Service, jedes Detail."
            echo ""
            echo "Finde KONKRETE, umsetzbare Verbesserungen in diesen Kategorien:"
            echo "- bug:         echte Bugs, Abstürze, Null-Fehler, falsche Logik"
            echo "- ui:          UI/UX-Schwächen, Inkonsistenzen, schlechte Usability"
            echo "- feature:     sinnvolle neue Features/Module für eine"
            echo "               Nachbarschaftshilfe-App"
            echo "- performance: unnötige Rebuilds, fehlende .limit() bei Streams,"
            echo "               fehlendes autoDispose, ineffiziente Queries"
            echo "- i18n:        hardcodierte deutsche Strings ohne .tr()"
            echo "- database:    fehlende Indizes, RLS-Lücken, N+1-Abfragen"
            echo "- security:    unsichere Defaults, fehlende Validierung,"
            echo "               exponierte Daten"
            echo "- config:      veraltete Dependencies, Konfigurationsfehler"
            echo ""
            echo "Beachte die Projektregeln in CLAUDE.md (i18n-Pflicht,"
            echo "Supabase-Stream-Limits, Design-System teal/primary, KEINE"
            echo "emerald-Farben). Verstöße dagegen sind valide Vorschläge."
            echo ""
            echo "TIEFEN-AUDIT — prüfe die App SYSTEMATISCH zusätzlich auf"
            echo "(jeweils eigene Kategorie verwenden):"
            echo "- accessibility: fehlende Semantics/Labels, zu kleine Tap-Targets"
            echo "  (<48dp), schwacher Kontrast, fehlende Screenreader-Hinweise."
            echo "- design:        Verstöße gegen das Design-System (Spacing,"
            echo "  Typo-Hierarchie, Farben außerhalb AppColors, inkonsistente"
            echo "  Cards/Buttons/Abstände) — Ziel: elegant, professionell, subtil,"
            echo "  viel Weißraum. Nenne Screen + konkrete Politur."
            echo "- i18n-coverage: hardcodierte Strings ODER .tr()-Keys, die in"
            echo "  einzelnen der 7 JSON-Dateien fehlen."
            echo "- dead-code:     ungenutzte Widgets/Methoden/Imports/Assets."
            echo "- test-coverage: wichtige Repositories/Services/Logik OHNE Tests."
            echo "- rls-security:  Zugriffe ohne passende RLS, fremde Nutzerdaten"
            echo "  erreichbar, fehlende Eingabevalidierung."
            echo "Verteile die Vorschläge über ALLE Module (Marktplatz, Events,"
            echo "Skills, Krise, Gruppen, Chat, Profil, Karte, Nachbarschaft …) —"
            echo "konzentriere dich nicht nur auf ein Modul."
            echo ""
            echo "WICHTIG — schlage AUSDRÜCKLICH auch NEUERUNGEN vor (komplett"
            echo "neue Features/Module/Ideen, die die App besser machen), nicht"
            echo "nur Korrekturen. Mische Bugs, Verbesserungen UND Neuerungen."
            echo ""
            echo "Markiere jeden Vorschlag mit 'kind':"
            echo "  - bug          = ein Fehler/Bug, der behoben werden muss"
            echo "  - improvement  = Verbesserung von etwas Vorhandenem"
            echo "  - new          = Neuerung / komplett neues Feature"
            echo ""
            echo "Gib zu JEDEM Vorschlag eine 'reason' an — leicht verständlich,"
            echo "WARUM das geändert/verbessert/neu gemacht werden soll (1-2 Sätze,"
            echo "Deutsch, konkreter Nutzen für die Nutzer)."
            echo ""
            echo "Du DARFST eigene, treffendere Kategorien vergeben (selbstlernend),"
            echo "wenn die Standardkategorien nicht passen. 'category' ist ein kurzer"
            echo "Schlüssel (klein, ohne Leerzeichen, z. B. 'accessibility',"
            echo "'onboarding', 'monetization'). 'category_label' ist der lesbare"
            echo "deutsche Name dazu. Standardkategorien:"
            echo "  ui, feature, bug, performance, i18n, database, security, config."
            echo ""
            echo "Konzentriere dich auf die wirkungsvollsten 12-25 Vorschläge."
            echo "Jeder Vorschlag MUSS so formuliert sein, dass ein Entwickler-Agent"
            echo "ihn ohne Rückfragen umsetzen kann (instruction = klare Anweisung,"
            echo "auf Deutsch, mit Dateibezug)."
            echo ""
            echo "Schreibe das Ergebnis als reines JSON in die Datei"
            echo "/tmp/suggestions.json (NICHTS sonst dorthin). Format:"
            echo '{ "suggestions": [ {'
            echo '  "category": "kurzer-schlüssel (Standard oder eigene Kategorie)",'
            echo '  "category_label": "Lesbarer deutscher Name der Kategorie",'
            echo '  "kind": "bug|improvement|new",'
            echo '  "severity": "low|medium|high|critical",'
            echo '  "title": "Kurzer Titel (Deutsch)",'
            echo '  "description": "Was ist das Problem / der Nutzen (1-3 Sätze, Deutsch)",'
            echo '  "reason": "WARUM (leicht verständlich, 1-2 Sätze, Deutsch)",'
            echo '  "instruction": "Präzise Umsetzungs-Anweisung für den Dev-Agenten (Deutsch)",'
            echo '  "file_hint": "relativer Pfad zur betroffenen Datei",'
            echo '  "impact": 4,'
            echo '  "effort": 2'
            echo '} ] }'
            echo ""
            echo "PRIORISIERUNG: Gib bei JEDEM Vorschlag impact (1-5, Nutzen für"
            echo "Nutzer/App, 5=sehr hoch) und effort (1-5, Umsetzungsaufwand,"
            echo "1=schnell, 5=groß) an. Quick-Wins (hoher Nutzen, wenig Aufwand)"
            echo "sind besonders wertvoll — bewerte ehrlich, nicht alles auf 5."
            echo ""
            echo "MODUL-HEALTH-MATRIX: Gib im selben JSON zusätzlich ein Feld"
            echo '"modules" aus — eine Bewertung JEDES größeren App-Moduls'
            echo "(z. B. marketplace, events, skills, crisis, groups, chat,"
            echo "profile, map, neighborhood, dashboard). Bewerte ehrlich 0-100:"
            echo '{ "modules": [ {'
            echo '  "module": "kurzer-schlüssel (z. B. marketplace)",'
            echo '  "label": "Lesbarer Name (z. B. Marktplatz)",'
            echo '  "score": 72,            (Gesamt 0-100)'
            echo '  "completeness": 80,     (Funktionsumfang 0-100)'
            echo '  "quality": 70,          (Code-/UX-Qualität 0-100)'
            echo '  "tests": 40,            (Testabdeckung 0-100)'
            echo '  "notes": "1-2 Sätze: größte Lücke / Schwerpunkt"'
            echo "} ] }"
            echo "Das Gesamt-JSON hat also BEIDE Felder: suggestions UND modules."
            echo ""
            echo "Ändere KEINEN Code. Erstelle KEINEN Commit. Nur analysieren und"
            echo "die JSON-Datei schreiben. Verwende deine Skills/Tools zum Lesen"
            echo "des Codes ausgiebig — sei gründlich, geh in die Tiefe."
            echo ""
            echo "RESSOURCEN-KATALOG: Lies docs/godmode/resources.md. Wenn ein"
            echo "Vorschlag eine API/externe Funktion braucht, BEVORZUGE die dort"
            echo "gelisteten KOSTENLOSEN APIs (möglichst ohne Key) + bewährten"
            echo "Open-Source-Pakete und NENNE die konkrete Ressource in der"
            echo "instruction (z. B. 'via Open-Meteo, kein Key'). Schlage nichts"
            echo "vor, das eine teure/kostenpflichtige Abhängigkeit erzwingt,"
            echo "wenn es eine freie Alternative im Katalog gibt."
          } > /tmp/scan_prompt.txt

          # ── Selbstlernend: bereits abgelehnte/angenommene Vorschläge laden ──
          # Der Agent soll abgelehnte NIEMALS erneut vorschlagen und bereits
          # angenommene/umgesetzte nicht duplizieren.
          REJECTED=$(curl -sS \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_dev_suggestions?select=title&status=eq.rejected&order=reviewed_at.desc&limit=80" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);process.stdout.write(a.map(x=>"- "+x.title).join("\n"))}catch{process.stdout.write("")}})' || true)
          ACCEPTED=$(curl -sS \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_dev_suggestions?select=title&status=eq.accepted&order=reviewed_at.desc&limit=80" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);process.stdout.write(a.map(x=>"- "+x.title).join("\n"))}catch{process.stdout.write("")}})' || true)
          {
            echo ""
            echo "=== SELBSTLERNEND — NICHT WIEDERHOLEN ==="
            if [ -n "$REJECTED" ]; then
              echo "Diese Vorschläge wurden vom Admin ABGELEHNT. Schlage sie NIEMALS"
              echo "erneut vor (auch nicht ähnlich formuliert):"
              echo "$REJECTED"
              echo ""
            fi
            if [ -n "$ACCEPTED" ]; then
              echo "Diese Vorschläge wurden bereits ANGENOMMEN/umgesetzt. Dupliziere"
              echo "sie nicht — schlage höchstens sinnvolle Folge-Verbesserungen vor:"
              echo "$ACCEPTED"
            fi
          } >> /tmp/scan_prompt.txt

          # ── Produktionssignale: echte Crashes/Fehler aus der Live-App ──────
          # Damit der Scan Fixes für ECHTE Probleme priorisiert (nicht nur
          # generisches Code-Review). Aggregiert nach Häufigkeit (häufigste zuerst).
          CRASHES=$(curl -sS \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/crash_logs?select=error_type,error_message,app_version&order=created_at.desc&limit=80" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{var a=JSON.parse(s);var m={};for(var i=0;i<a.length;i++){var x=a[i];var k=(x.error_type||"?")+" | "+String(x.error_message||"").slice(0,140);if(!m[k])m[k]={n:0,v:x.app_version};m[k].n++;}var e=Object.keys(m).map(function(k){return [k,m[k]]}).sort(function(p,q){return q[1].n-p[1].n}).slice(0,15);process.stdout.write(e.map(function(z){return "- ("+z[1].n+"x, v"+(z[1].v||"?")+") "+z[0]}).join("\n"))}catch(e){process.stdout.write("")}})' || true)
          ERRORS=$(curl -sS \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/error_logs?select=error_type,message,app_version&order=created_at.desc&limit=80" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{var a=JSON.parse(s);var m={};for(var i=0;i<a.length;i++){var x=a[i];var k=(x.error_type||"?")+" | "+String(x.message||"").slice(0,140);if(!m[k])m[k]={n:0,v:x.app_version};m[k].n++;}var e=Object.keys(m).map(function(k){return [k,m[k]]}).sort(function(p,q){return q[1].n-p[1].n}).slice(0,15);process.stdout.write(e.map(function(z){return "- ("+z[1].n+"x, v"+(z[1].v||"?")+") "+z[0]}).join("\n"))}catch(e){process.stdout.write("")}})' || true)
          {
            if [ -n "$CRASHES" ] || [ -n "$ERRORS" ]; then
              echo ""
              echo "=== PRODUKTIONS-SIGNALE (echte Fehler aus der Live-App) ==="
              echo "Reale Crashes/Fehler echter Nutzer, häufigste zuerst (Anzahl x)."
              echo "PRIORISIERE Vorschläge, die diese konkret beheben: kind=bug,"
              echo "severity entsprechend hoch, und nenne die wahrscheinliche"
              echo "Ursache + betroffene Datei. Suche die zugehörige Code-Stelle."
              if [ -n "$CRASHES" ]; then echo ""; echo "Crashes (crash_logs):"; echo "$CRASHES"; fi
              if [ -n "$ERRORS" ]; then echo ""; echo "Fehler (error_logs):"; echo "$ERRORS"; fi
            fi
          } >> /tmp/scan_prompt.txt

      # Live-Fortschritt-Tailer: liest den stream-json-Output der Claude CLI,
      # erkennt jede gelesene Datei (Read/Grep/Glob) und schreibt laufend
      # current_file + analyzed_files + heartbeat nach admin_scan_runs. So sieht
      # das Dashboard in Echtzeit, welche Datei gerade analysiert wird.
      - name: Fortschritt-Tailer schreiben
        if: env.SKIP_SCAN != '1'
        run: |
          cat > /tmp/progress_tailer.js <<'TAILER'
          const https = require('https');
          const readline = require('readline');
          const REF = process.env.SUPABASE_REF;
          const SRK = process.env.SRK;
          const SCAN_ID = process.env.SCAN_ID;
          let analyzed = 0;
          let lastFile = '';
          let lastSent = 0;

          function patch(fields) {
            const data = JSON.stringify({ ...fields, updated_at: new Date().toISOString() });
            const req = https.request({
              method: 'PATCH',
              hostname: REF + '.supabase.co',
              path: '/rest/v1/admin_scan_runs?id=eq.' + SCAN_ID,
              headers: {
                apikey: SRK,
                Authorization: 'Bearer ' + SRK,
                'Content-Type': 'application/json',
                Prefer: 'return=minimal',
                'Content-Length': Buffer.byteLength(data),
              },
            }, (res) => { res.resume(); });
            req.on('error', () => {});
            req.write(data);
            req.end();
          }

          function send(force) {
            const now = Date.now();
            if (!force && now - lastSent < 2500) return;
            lastSent = now;
            patch({
              phase: 'scanning',
              current_file: lastFile.slice(0, 300),
              analyzed_files: analyzed,
              heartbeat_at: new Date().toISOString(),
            });
          }

          function shorten(p) {
            if (!p) return '';
            const i = p.indexOf('flutter_app/');
            return i >= 0 ? p.slice(i) : p;
          }

          // Heartbeat auch wenn die KI gerade nachdenkt (keine neue Datei).
          const hb = setInterval(() => send(true), 5000);
          hb.unref();

          const rl = readline.createInterface({ input: process.stdin });
          rl.on('line', (line) => {
            process.stdout.write(line + '\n');
            let ev;
            try { ev = JSON.parse(line); } catch (_) { return; }
            if (ev && ev.type === 'assistant' && ev.message && Array.isArray(ev.message.content)) {
              for (const b of ev.message.content) {
                if (b && b.type === 'tool_use') {
                  const inp = b.input || {};
                  const f = inp.file_path || inp.path || inp.pattern || '';
                  if (['Read', 'Grep', 'Glob'].includes(b.name) && f) {
                    analyzed++;
                    lastFile = shorten(String(f));
                    send(false);
                  }
                }
              }
            }
          });
          rl.on('close', () => send(true));
          TAILER
          echo "Tailer geschrieben."

      - name: Analyse ausführen
        if: env.SKIP_SCAN != '1'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          # stream-json (+ --verbose Pflicht) liefert pro Schritt ein JSON-Event.
          # Wir leiten es durch den Tailer, der den Live-Fortschritt nach Supabase
          # schreibt. suggestions.json schreibt die CLI weiterhin via Write-Tool.
          claude -p "$(cat /tmp/scan_prompt.txt)" \
            --model "$AGENT_MODEL" \
            --output-format stream-json --verbose \
            --dangerously-skip-permissions \
            --max-turns 120 \
            2> /tmp/scan_err.log \
            | node /tmp/progress_tailer.js > /tmp/scan_output.log
          echo "Exit (pipe): ${PIPESTATUS[0]}"
          echo "----- Analyse-Fehlerausgabe (letzte 20 Zeilen) -----"
          tail -n 20 /tmp/scan_err.log || true

      - name: Vorschläge nach Supabase schreiben
        if: env.SKIP_SCAN != '1'
        run: |
          set -e
          if [ ! -s /tmp/suggestions.json ]; then
            echo "Keine suggestions.json erzeugt."
            curl -sS -X PATCH \
              "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_scan_runs?id=eq.${SCAN_ID}" \
              -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
              -H "Content-Type: application/json" -H "Prefer: return=minimal" \
              -d "{\"status\":\"failed\",\"error\":\"Keine Vorschläge erzeugt.\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"
            exit 0
          fi

          # JSON in REST-Bulk-Insert-Rows umwandeln (scan_id anreichern, validieren).
          # Schreibt zwei Dateien: /tmp/rows.json (Vorschläge) + /tmp/cats.json
          # (neu entdeckte Kategorien für admin_dev_categories).
          SCAN_ID="$SCAN_ID" node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("/tmp/suggestions.json", "utf8");
            let parsed;
            try { parsed = JSON.parse(raw); }
            catch (e) {
              const a = raw.indexOf("{"); const b = raw.lastIndexOf("}");
              parsed = JSON.parse(raw.slice(a, b + 1));
            }
            const builtin = ["ui","feature","bug","performance","i18n","database","security","config"];
            const sevs = ["low","medium","high","critical"];
            const kinds = ["bug","improvement","new"];
            const slug = (s) => String(s || "").toLowerCase().trim()
              .replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 40);
            const clamp = (x) => Math.min(Math.max(parseInt(x, 10) || 0, 0), 100);
            const newCats = {};
            const out = (parsed.suggestions || [])
              .filter(s => s && s.title && s.instruction)
              .slice(0, 40)
              .map(s => {
                let cat = slug(s.category) || "feature";
                if (!builtin.includes(cat)) {
                  const label = String(s.category_label || s.category || cat).slice(0, 60);
                  newCats[cat] = { key: cat, label, source: "ai" };
                }
                return {
                  scan_id: process.env.SCAN_ID,
                  category: cat,
                  kind: kinds.includes(s.kind) ? s.kind : "improvement",
                  severity: sevs.includes(s.severity) ? s.severity : "medium",
                  title: String(s.title).slice(0, 200),
                  description: s.description ? String(s.description).slice(0, 1000) : null,
                  reason: s.reason ? String(s.reason).slice(0, 600) : null,
                  instruction: String(s.instruction).slice(0, 2000),
                  file_hint: s.file_hint ? String(s.file_hint).slice(0, 300) : null,
                  impact: Math.min(Math.max(parseInt(s.impact, 10) || 3, 1), 5),
                  effort: Math.min(Math.max(parseInt(s.effort, 10) || 3, 1), 5),
                };
              });
            const mods = (parsed.modules || [])
              .filter(m => m && m.module)
              .slice(0, 40)
              .map(m => ({
                module: slug(m.module),
                label: String(m.label || m.module).slice(0, 60),
                score: clamp(m.score),
                completeness: clamp(m.completeness),
                quality: clamp(m.quality),
                tests: clamp(m.tests),
                notes: m.notes ? String(m.notes).slice(0, 600) : null,
                updated_at: new Date().toISOString(),
              }))
              .filter(m => m.module);
            fs.writeFileSync("/tmp/rows.json", JSON.stringify(out));
            fs.writeFileSync("/tmp/cats.json", JSON.stringify(Object.values(newCats)));
            fs.writeFileSync("/tmp/modules.json", JSON.stringify(mods));
          '
          ROWS="$(cat /tmp/rows.json)"
          CATS="$(cat /tmp/cats.json)"

          COUNT="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).length))' "$ROWS")"
          CATCOUNT="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).length))' "$CATS")"
          echo "Erzeugte Vorschläge: $COUNT | Neue Kategorien: $CATCOUNT"

          # Neu entdeckte Kategorien selbstlernend anlegen (Konflikt = ignorieren).
          if [ "$CATCOUNT" -gt 0 ]; then
            curl -sS -X POST \
              "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_dev_categories?on_conflict=key" \
              -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal,resolution=ignore-duplicates" \
              -d "$CATS" || true
          fi

          if [ "$COUNT" -gt 0 ]; then
            curl -sS -X POST \
              "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_dev_suggestions" \
              -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
              -H "Content-Type: application/json" -H "Prefer: return=minimal" \
              -d "$ROWS"
          fi

          # Modul-Health-Matrix upserten (on_conflict=module → aktualisieren).
          MODS="$(cat /tmp/modules.json 2>/dev/null || echo '[]')"
          MODCOUNT="$(node -e 'try{process.stdout.write(String(JSON.parse(process.argv[1]).length))}catch(e){process.stdout.write("0")}' "$MODS")"
          echo "Modul-Bewertungen: $MODCOUNT"
          if [ "$MODCOUNT" -gt 0 ]; then
            curl -sS -X POST \
              "https://${SUPABASE_REF}.supabase.co/rest/v1/godmode_module_health?on_conflict=module" \
              -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal,resolution=merge-duplicates" \
              -d "$MODS" || true
          fi

          curl -sS -X PATCH \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_scan_runs?id=eq.${SCAN_ID}" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"status\":\"done\",\"phase\":\"done\",\"found\":${COUNT},\"found_so_far\":${COUNT},\"current_file\":null,\"heartbeat_at\":\"$(date -u +%FT%TZ)\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"

      - name: Status -> failed (bei Fehler)
        if: failure() && env.SKIP_SCAN != '1' && env.SCAN_ID != ''
        run: |
          curl -sS -X PATCH \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_scan_runs?id=eq.${SCAN_ID}" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"status\":\"failed\",\"error\":\"Workflow fehlgeschlagen. Siehe Action-Log.\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"
