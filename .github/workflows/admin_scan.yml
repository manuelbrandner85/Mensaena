name: 🔎 Admin Deep Scan

# ════════════════════════════════════════════════════════════════════════
# Tiefenanalyse der GESAMTEN App. Wird vom Admin-Dashboard via Edge Function
# `admin-dev-suggestions` (action='scan') getriggert. Die Claude Code CLI liest
# den kompletten Code (jeden Screen, jedes Detail) und meldet konkrete
# Vorschläge — logische Fehler, Bugs, UI/UX-Verbesserungen, Performance,
# i18n-Lücken, Sicherheits-/Datenbankprobleme — als JSON. Diese werden in
# admin_dev_suggestions geschrieben; der Admin nimmt sie im Dashboard an
# (→ admin_dev_tasks → PR → OTA) oder lehnt sie ab.
#
# WICHTIG: Dieser Workflow ändert KEINEN Code und erstellt KEINEN PR. Er
# analysiert nur und schreibt Vorschläge. Das Umsetzen passiert erst nach
# Annahme durch den Admin (admin_agent.yml).
#
# Benötigte GitHub Secrets:
#   CLAUDE_CODE_OAUTH_TOKEN ODER ANTHROPIC_API_KEY  — für die Claude Code CLI
#   SUPABASE_SERVICE_ROLE_KEY                        — Vorschläge schreiben
#
# Hinweis: scan_id wird AUSSCHLIESSLICH über Umgebungsvariablen genutzt —
# niemals via ${{ }}-Interpolation in run-Blöcken (Script-Injection-Schutz).
# ════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      scan_id:
        description: 'admin_scan_runs.id (UUID)'
        required: true

permissions:
  contents: read

env:
  SUPABASE_REF: gyqujitkvymlmgroovch
  AGENT_MODEL: claude-sonnet-4-6
  SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SCAN_ID: ${{ inputs.scan_id }}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Status -> running
        run: |
          curl -sS -X PATCH \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_scan_runs?id=eq.${SCAN_ID}" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"status\":\"running\",\"run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Claude Code CLI installieren
        run: npm install -g @anthropic-ai/claude-code

      - name: Analyse-Prompt schreiben
        run: |
          {
            echo "Du bist der Mensaena-Qualitäts-Analyst. Analysiere die GESAMTE"
            echo "Flutter-App unter flutter_app/lib/ — JEDEN Screen, jedes Widget,"
            echo "jedes Repository, jeden Service, jedes Detail."
            echo ""
            echo "Finde KONKRETE, umsetzbare Verbesserungen in diesen Kategorien:"
            echo "- bug:         echte Bugs, Abstürze, Null-Fehler, falsche Logik"
            echo "- ui:          UI/UX-Schwächen, Inkonsistenzen, schlechte Usability"
            echo "- feature:     sinnvolle neue Features/Module für eine"
            echo "               Nachbarschaftshilfe-App"
            echo "- performance: unnötige Rebuilds, fehlende .limit() bei Streams,"
            echo "               fehlendes autoDispose, ineffiziente Queries"
            echo "- i18n:        hardcodierte deutsche Strings ohne .tr()"
            echo "- database:    fehlende Indizes, RLS-Lücken, N+1-Abfragen"
            echo "- security:    unsichere Defaults, fehlende Validierung,"
            echo "               exponierte Daten"
            echo "- config:      veraltete Dependencies, Konfigurationsfehler"
            echo ""
            echo "Beachte die Projektregeln in CLAUDE.md (i18n-Pflicht,"
            echo "Supabase-Stream-Limits, Design-System teal/primary, KEINE"
            echo "emerald-Farben). Verstöße dagegen sind valide Vorschläge."
            echo ""
            echo "Konzentriere dich auf die wirkungsvollsten 12-25 Vorschläge."
            echo "Jeder Vorschlag MUSS so formuliert sein, dass ein Entwickler-Agent"
            echo "ihn ohne Rückfragen umsetzen kann (instruction = klare Anweisung,"
            echo "auf Deutsch, mit Dateibezug)."
            echo ""
            echo "Schreibe das Ergebnis als reines JSON in die Datei"
            echo "/tmp/suggestions.json (NICHTS sonst dorthin). Format:"
            echo '{ "suggestions": [ {'
            echo '  "category": "bug|ui|feature|performance|i18n|database|security|config",'
            echo '  "severity": "low|medium|high|critical",'
            echo '  "title": "Kurzer Titel (Deutsch)",'
            echo '  "description": "Was ist das Problem / der Nutzen (1-3 Sätze, Deutsch)",'
            echo '  "instruction": "Präzise Umsetzungs-Anweisung für den Dev-Agenten (Deutsch)",'
            echo '  "file_hint": "relativer Pfad zur betroffenen Datei"'
            echo '} ] }'
            echo ""
            echo "Ändere KEINEN Code. Erstelle KEINEN Commit. Nur analysieren und"
            echo "die JSON-Datei schreiben. Verwende deine Skills/Tools zum Lesen"
            echo "des Codes ausgiebig — sei gründlich, geh in die Tiefe."
          } > /tmp/scan_prompt.txt

      - name: Analyse ausführen
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          claude -p "$(cat /tmp/scan_prompt.txt)" \
            --model "$AGENT_MODEL" \
            --dangerously-skip-permissions \
            --max-turns 120 \
            > /tmp/scan_output.log 2>&1
          echo "Exit: $?"
          echo "----- Analyse-Ausgabe (letzte 40 Zeilen) -----"
          tail -n 40 /tmp/scan_output.log || true

      - name: Vorschläge nach Supabase schreiben
        run: |
          set -e
          if [ ! -s /tmp/suggestions.json ]; then
            echo "Keine suggestions.json erzeugt."
            curl -sS -X PATCH \
              "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_scan_runs?id=eq.${SCAN_ID}" \
              -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
              -H "Content-Type: application/json" -H "Prefer: return=minimal" \
              -d "{\"status\":\"failed\",\"error\":\"Keine Vorschläge erzeugt.\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"
            exit 0
          fi

          # JSON in REST-Bulk-Insert-Rows umwandeln (scan_id anreichern, validieren).
          ROWS="$(SCAN_ID="$SCAN_ID" node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("/tmp/suggestions.json", "utf8");
            let parsed;
            try { parsed = JSON.parse(raw); }
            catch (e) {
              const a = raw.indexOf("{"); const b = raw.lastIndexOf("}");
              parsed = JSON.parse(raw.slice(a, b + 1));
            }
            const cats = ["ui","feature","bug","performance","i18n","database","security","config"];
            const sevs = ["low","medium","high","critical"];
            const out = (parsed.suggestions || [])
              .filter(s => s && s.title && s.instruction)
              .slice(0, 40)
              .map(s => ({
                scan_id: process.env.SCAN_ID,
                category: cats.includes(s.category) ? s.category : "feature",
                severity: sevs.includes(s.severity) ? s.severity : "medium",
                title: String(s.title).slice(0, 200),
                description: s.description ? String(s.description).slice(0, 1000) : null,
                instruction: String(s.instruction).slice(0, 2000),
                file_hint: s.file_hint ? String(s.file_hint).slice(0, 300) : null,
              }));
            process.stdout.write(JSON.stringify(out));
          ')"

          COUNT="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).length))' "$ROWS")"
          echo "Erzeugte Vorschläge: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            curl -sS -X POST \
              "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_dev_suggestions" \
              -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
              -H "Content-Type: application/json" -H "Prefer: return=minimal" \
              -d "$ROWS"
          fi

          curl -sS -X PATCH \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_scan_runs?id=eq.${SCAN_ID}" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"status\":\"done\",\"found\":${COUNT},\"updated_at\":\"$(date -u +%FT%TZ)\"}"

      - name: Status -> failed (bei Fehler)
        if: failure()
        run: |
          curl -sS -X PATCH \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_scan_runs?id=eq.${SCAN_ID}" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"status\":\"failed\",\"error\":\"Workflow fehlgeschlagen. Siehe Action-Log.\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"
