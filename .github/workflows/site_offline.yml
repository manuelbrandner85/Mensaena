name: Take www.mensaena.de offline

# Loescht den Cloudflare-Worker "mensaena" inklusive seiner Custom Domains
# (www.mensaena.de, mensaena.de) und des Cron-Triggers. Danach ist die
# Website nicht mehr erreichbar. Code und Supabase-Datenbank bleiben erhalten.
#
# Wieder online bringen: Actions-Tab -> "Deploy to Cloudflare Workers" -> Run workflow.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/site_offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Cloudflare token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error title=Missing secret::CLOUDFLARE_API_TOKEN fehlt."
            exit 1
          fi

      - name: Delete Worker "mensaena"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: accac25964381d7a5200932dac6d270d
        run: |
          cd "$RUNNER_TEMP"
          npx --yes wrangler@4 delete --name mensaena --force

      - name: Verify site is unreachable
        run: |
          sleep 20
          for url in https://www.mensaena.de https://mensaena.de; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url" || echo "000")
            echo "$url -> HTTP $code"
          done
