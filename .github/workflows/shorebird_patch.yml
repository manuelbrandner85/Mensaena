name: 🚀 Shorebird OTA Patch

# Mensaena-Pendant zum Weltenbibliothek-Pattern (eigenes Repo, eigene
# Secrets, eigene Tabelle). Pusht einen Dart-only Patch auf das aktuelle
# Shorebird-Release damit installierte 2.0.0+20000-User die Änderungen
# beim nächsten Launch automatisch holen.
#
# Wann benutzen:
#   • Nach Dart-Code-Änderungen (lib/**) die KEINE neue native Lib brauchen
#   • Dependencies/Plugins dürfen NICHT geändert werden (= neuer Release nötig)

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch mit dem zu patchenden Code'
        required: false
        default: 'main'
  # Auto-Patch bei JEDEM Push auf main mit Dart-Änderung. Doppelte Patches
  # (gleicher Code) sind harmlos — der Client ignoriert sie.
  push:
    branches:
      - main
    paths:
      - 'flutter_app/**'

permissions:
  contents: read

# Patches dürfen NICHT parallel laufen — Shorebird nimmt den zuletzt
# hochgeladenen Patch als aktiv. Pro Branch nur ein Patch gleichzeitig,
# ältere laufende Jobs werden beim neuen Push gecancelt.
concurrency:
  group: shorebird-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    name: 📡 Shorebird Patch android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_branch || github.sha }}
          # fetch-depth 2 -> wir koennen pubspec.version mit dem Vor-Commit
          # vergleichen (Patch-Guard: bei Versions-Bump skippen).
          fetch-depth: 2

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Flutter 3.27.x explizit — nur damit `flutter pub get` das pub-cache
      # füllt BEVOR der flutter_webrtc-Patch läuft. Ohne dieses SDK lief das
      # Patch-Skript ins Leere (Paket noch nicht heruntergeladen) und Shorebird
      # kompilierte danach das UNGEPATCHTE flutter_webrtc → Build-Fehler
      # `onSurfaceDestroyed() not overridden`. Die Patch-Engine selbst übernimmt
      # Shorebird weiterhin vom Ziel-Release (kein --flutter-version beim patch).
      - name: 🐦 Flutter 3.27.x (nur für pub get + Patch)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true

      # Pinned wie Weltenbibliothek: ohne Pin driftet setup-shorebird@v1 auf
      # die jeweils neueste CLI und damit auf einen anderen Flutter-Engine-
      # Snapshot — Patches uploaden dann zwar erfolgreich, werden aber vom
      # Client auf dem Gerät still verworfen weil die Engine-Bytes nicht zum
      # registrierten Release passen.
      - name: 🐦 Shorebird
        # setup-shorebird@v1 hat KEINEN version-Input (nur `cache`).
        # Frueher `shorebird-version: 1.6.92` wurde ignoriert -> Warning
        # "Unexpected input(s) 'shorebird-version'". Pin daher entfernt;
        # release + patch nutzen so dieselbe (jeweils aktuelle) CLI.
        uses: shorebirdtech/setup-shorebird@v1

      - name: 📋 Version lesen
        id: version
        run: |
          FULL=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | tr -d '[:space:]')
          SHORT=$(echo "$FULL" | sed 's/+.*//')
          BUILD=$(echo "$FULL" | sed 's/.*+//')
          echo "full=$FULL"   >> $GITHUB_OUTPUT
          echo "short=$SHORT" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "App-Version: $FULL"

      # ── Signing: Keystore aus Secrets wiederherstellen ───────────────────
      # `shorebird patch android` baut intern eine AAB für Engine-Diffing.
      # Ohne Release-Signing schlägt der AAB-Build fehl. android/app/
      # build.gradle.kts ist im Repo und liest key.properties — wir füllen
      # nur das key.properties + den Keystore-Pfad zur Laufzeit.
      - name: 🔐 Validate Android signing secrets
        env:
          KS_B64:    ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS:   ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS:  ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for var in KS_B64 KS_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!var}" ]; then
              echo "::error title=Missing secret::ANDROID_${var#KS_} fehlt"
              missing=1
            fi
          done
          exit $missing

      - name: 🔐 Restore keystore from secret
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          python3 -c "import os,base64,re,sys; raw=os.environ['KS_B64']; clean=re.sub(r'[^A-Za-z0-9+/=]','',raw).rstrip('='); d=base64.b64decode(clean+'='*(-len(clean)%4)); open(os.path.join(os.environ['RUNNER_TEMP'],'signing','mensaena.jks'),'wb').write(d); valid=d[:4]==b'\xfe\xed\xfe\xed' or d[:2]==b'\x30\x82'; print('Keystore:',len(d),'bytes valid=',valid); sys.exit('Invalid keystore – ANDROID_KEYSTORE_BASE64 ist korrupt') if not valid else None"

      - name: 🔐 Write key.properties
        env:
          KS_PASS:   ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS:  ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${KS_PASS}
          keyPassword=${KEY_PASS}
          keyAlias=${KEY_ALIAS}
          storeFile=${RUNNER_TEMP}/signing/mensaena.jks
          EOF

      - name: 🔥 Restore google-services.json (Firebase / FCM)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret fehlt — FCM-Build schlägt fehl"
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 -c "import json; json.load(open('android/app/google-services.json'))" \
            && echo "google-services.json OK"

      - name: 🩺 Shorebird-Status + Release-Check
        id: status
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          FULL: ${{ steps.version.outputs.full }}
        run: |
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "::error::SHOREBIRD_TOKEN secret fehlt — kein Patch möglich"
            exit 1
          fi
          echo "── shorebird --version ──"
          shorebird --version || true
          # PATCH-GUARD: Wurde die Version in DIESEM Push gebumpt, ist es ein
          # NEUES Release (via flutter.yml `shorebird release`), KEIN Patch.
          # Ein Patch auf eine brandneue Version erreicht keinen Nutzer (niemand
          # ist drauf). Daher hier skippen -> Patches sammeln sich nur auf einem
          # bereits veröffentlichten Release (Dart-only-Commits ohne Bump).
          PREV=$(git show HEAD~1:flutter_app/pubspec.yaml 2>/dev/null \
            | grep '^version:' | sed 's/version: *//' | tr -d '[:space:]' || echo "")
          if [ -n "$PREV" ] && [ "$PREV" != "$FULL" ]; then
            echo "::notice::Versions-Bump $PREV -> $FULL erkannt — Patch übersprungen (neues Release via flutter.yml)."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # FIX: Option heißt --platform (Singular). --platforms war ungültig
          # -> Befehl scheiterte -> Release-Check fand nie ein Release ->
          # JEDER Patch wurde uebersprungen (OTA hat nie ausgeliefert).
          echo "── shorebird releases list --platform=android ──"
          RELEASES=$(shorebird releases list --platform=android 2>&1 || true)
          echo "$RELEASES"

          # Wenn kein Release für die aktuelle pubspec-Version existiert, skippen.
          # → Verhindert noisy Failure wenn Version-Bump (z.B. force-update auf
          #   neue APK-Version) gepusht wird bevor shorebird_release.yml lief.
          if ! echo "$RELEASES" | grep -q "$FULL"; then
            echo "::warning::Kein Shorebird-Release für $FULL — skip patch."
            echo "::warning::Trigger shorebird_release.yml einmalig für initiales Release."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # pub-cache MUSS gefüllt sein bevor der Patch greift — sonst patcht das
      # Skript ein nicht vorhandenes flutter_webrtc und Shorebird kompiliert
      # später die ungepatchte Version.
      - name: 📦 flutter pub get (pub-cache füllen)
        if: steps.status.outputs.skip != 'true'
        run: flutter pub get

      # ── flutter_webrtc Flutter-3.27-Patch ──
      # Idempotenter Java-Patch: onSurfaceCleanup → onSurfaceDestroyed
      - name: Patch flutter_webrtc
        if: steps.status.outputs.skip != 'true'
        run: bash scripts/patch_flutter_webrtc.sh

      # ── Patch (kein hybrider release-or-patch) ──────────────────────────
      # Weltenbibliothek-Pattern: Wenn das Release noch nicht existiert,
      # läuft separate `shorebird_release.yml` (workflow_dispatch one-shot).
      # Hier wird IMMER nur gepatcht.
      - name: 📡 Patch veröffentlichen
        id: patch
        if: steps.status.outputs.skip != 'true'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          set -euo pipefail
          echo "Ziel-Release-Version: ${{ steps.version.outputs.full }}"
          # KEIN --flutter-version hier: `shorebird patch` kennt das Flag nicht
          # (nur `shorebird release`). Der Patch übernimmt die Flutter-Version
          # automatisch vom Ziel-Release. Mit dem Flag → Exit 64 (Usage-Fehler).
          shorebird patch android \
            --release-version="${{ steps.version.outputs.full }}" \
            --no-confirm \
            --allow-asset-diffs \
            -- \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://gyqujitkvymlmgroovch.supabase.co' }} \
            --dart-define=API_BASE_URL=https://www.mensaena.de
          echo "✅ Patch an Release ${{ steps.version.outputs.full }} gesendet"

      # ── Changelog in app_releases-Tabelle (Mensaena-spezifisch) ─────────
      # Pendant zu Weltenbibliothek's app_config + update_history. Mensaena
      # konsolidiert beides in der app_releases-Tabelle, die der Flutter-
      # WhatsNewSheet ausliest.
      #
      # Verwendet Supabase PostgREST mit SERVICE_ROLE_KEY (bypasst RLS) statt
      # psql/pooler — robust gegen IPv6/Pooler-Probleme.
      - name: 📝 Changelog in app_releases schreiben
        if: success() && steps.status.outputs.skip != 'true'
        env:
          SUPABASE_URL: https://gyqujitkvymlmgroovch.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FULL: ${{ steps.version.outputs.full }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY nicht gesetzt — überspringe app_releases insert"
            exit 0
          fi

          TITLE=$(git log -1 --pretty=%s | sed 's/^[a-z]*([a-z]*): //' | head -c 100)
          BODY=$(git log -1 --pretty=%b | head -c 240 | tr '\n' ' ')

          # Patches sind nie mandatory — Force-Update läuft über APK-Release
          # (siehe flutter.yml).
          PAYLOAD=$(jq -n \
            --arg v "$FULL" \
            --argjson b "$BUILD" \
            --arg title "$TITLE" \
            --arg body "$BODY" \
            '{
              version: $v,
              build_number: $b,
              mandatory: false,
              is_patch: true,
              apk_url: null,
              platform: "android",
              changelog: { entries: [{ type: "improvement", title: $title, description: $body }] }
            }')

          # PostgREST INSERT — bei Conflict NICHT ueberschreiben.
          # Sonst wuerde der Patch-Insert eine bereits existierende APK-Row
          # (von flutter.yml) ueberschreiben: is_patch=true und
          # mandatory=false → User sehen weder Pflichtupdate noch das richtige
          # apk_url. Patches haben keine eigene Row noetig — die Changelog-
          # Info aus dem Commit wird auf die APK-Row gemappt (selbe Version).
          # Retry mit exponentiellem Backoff (5/10/20/40s) gegen Supabase-Gateway
          # 502/503/504-Flakiness. Patch ist schon live, nur der DB-Insert haengt.
          HTTP_CODE=""
          for attempt in 1 2 3 4 5; do
            HTTP_CODE=$(curl -sS --max-time 30 -o /tmp/ar_resp.json -w "%{http_code}" \
              -X POST "${SUPABASE_URL}/rest/v1/app_releases?on_conflict=version" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=ignore-duplicates,return=representation" \
              -d "$PAYLOAD") || HTTP_CODE="000"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
              break
            fi
            if [ "$HTTP_CODE" != "000" ] && [ "$HTTP_CODE" != "408" ] && \
               [ "$HTTP_CODE" != "429" ] && [ "${HTTP_CODE:0:1}" != "5" ]; then
              echo "::error::Permanenter HTTP-Code $HTTP_CODE — kein Retry."
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              SLEEP=$((5 * (2 ** (attempt - 1))))
              echo "⚠️  Versuch $attempt: HTTP $HTTP_CODE — warte ${SLEEP}s und versuche erneut..."
              sleep "$SLEEP"
            fi
          done

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "✅ app_releases-Eintrag für $FULL (Patch) gespeichert."
          else
            echo "::error::app_releases-Insert nach 5 Versuchen fehlgeschlagen (HTTP $HTTP_CODE)"
            cat /tmp/ar_resp.json || true
            exit 1
          fi
