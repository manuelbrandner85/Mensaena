name: 🧠 Module Intelligence Scan

# ════════════════════════════════════════════════════════════════════════
# Modul-Intelligenz-Analyse — Analysiert ALLE App-Module auf Schwachstellen,
# fehlende Features und Verbesserungspotenzial. Zusätzlich sucht der Agent
# auf GitHub nach ähnlichen Open-Source-Apps für Inspirationen.
#
# Getriggert von `admin-dev-modules` Edge Function (action='scan_start').
# Ändert KEINEN Code. Schreibt Erkenntnisse in admin_module_insights.
#
# Secrets: CLAUDE_CODE_OAUTH_TOKEN oder ANTHROPIC_API_KEY,
#          SUPABASE_SERVICE_ROLE_KEY.
# ════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      scan_id:
        description: 'admin_module_scan_runs.id (UUID)'
        required: true

permissions:
  contents: read

env:
  SUPABASE_REF: gyqujitkvymlmgroovch
  AGENT_MODEL: claude-sonnet-4-6
  SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SCAN_ID: ${{ inputs.scan_id }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Status -> running
        run: |
          curl -sS -X PATCH \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_module_scan_runs?id=eq.${SCAN_ID}" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"status\":\"running\",\"run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Claude Code CLI installieren
        run: npm install -g @anthropic-ai/claude-code

      - name: Bereits verworfene/angenommene Erkenntnisse laden (selbstlernend)
        id: history
        run: |
          # Abgelehnte Erkenntnisse: nie erneut vorschlagen.
          DISMISSED=$(curl -sS \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_module_insights?select=title&status=eq.dismissed&order=updated_at.desc&limit=60" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);process.stdout.write(a.map(x=>"- "+x.title).join("\n"))}catch{process.stdout.write("")}})' || true)
          ACCEPTED=$(curl -sS \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_module_insights?select=title&status=in.(accepted,implemented)&order=updated_at.desc&limit=60" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);process.stdout.write(a.map(x=>"- "+x.title).join("\n"))}catch{process.stdout.write("")}})' || true)
          {
            echo "DISMISSED<<EOF"
            echo "$DISMISSED"
            echo "EOF"
            echo "ACCEPTED<<EOF"
            echo "$ACCEPTED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Analyse-Prompt schreiben
        env:
          DISMISSED: ${{ steps.history.outputs.DISMISSED }}
          ACCEPTED:  ${{ steps.history.outputs.ACCEPTED }}
        run: |
          {
            echo "Du bist ein hochspezialisierter Modul-Intelligenz-Analyst für die"
            echo "Mensaena-Nachbarschaftshilfe-App. Analysiere JEDEN Screen und jedes"
            echo "Modul unter flutter_app/lib/screens/ gründlich."
            echo ""
            echo "=== DEINE AUFGABE ==="
            echo ""
            echo "1. MODUL-MAPPING"
            echo "   Finde mit Glob alle Screens (flutter_app/lib/screens/**/*.dart)."
            echo "   Gruppiere sie in Module (z.B. 'Chat', 'Marktplatz', 'Events'...)."
            echo ""
            echo "2. TIEFENANALYSE JE MODUL"
            echo "   Lies den Code jedes Moduls. Finde:"
            echo "   - Schwachstellen im UX (schlechte Usability, unklare Flows)"
            echo "   - Fehlende Features für eine Nachbarschaftshilfe-App"
            echo "   - Sicherheitslücken (RLS, Validierung, Datenweitergabe)"
            echo "   - Performance-Probleme (fehlende Stream-Limits, keine autoDispose)"
            echo "   - i18n-Lücken (hardcodierte Strings ohne .tr())"
            echo "   - Schwachstellen in POST-ERSTELLUNGS-SCREENS (Screens wo der User"
            echo "     Inhalte erstellt): fehlende Validierung, keine Bilder, fehlende"
            echo "     Kategorisierung, kein Standort-Feature, kein Anonymität-Schalter"
            echo ""
            echo "3. GITHUB-RECHERCHE (optional, aber wertvoll)"
            echo "   Suche mit WebSearch oder der GitHub API (keine Auth nötig für"
            echo "   öffentliche Repos) nach ähnlichen Open-Source-Apps:"
            echo "   - community-help-app, neighborhood-app, local-community flutter"
            echo "   - Vergleiche deren Features mit Mensaena"
            echo "   - Notiere interessante Features als 'inspiration'-Erkenntnisse"
            echo "   Beispiel curl: curl -sS 'https://api.github.com/search/repositories?"
            echo "   q=neighborhood+flutter&sort=stars&per_page=5'"
            echo ""
            echo "4. NEUE MODULE VORSCHLAGEN"
            echo "   Was fehlt Mensaena komplett (insight_type='new_module')?"
            echo "   Vergleiche mit Nextdoor, Nebenan.de, Komunal..."
            echo "   Beispiele: Nachbarschaftswachen, Hausmeister-Pool, Tier-Hilfe,"
            echo "   Pflanzen-Tausch, Lesekreis, Repair-Café..."
            echo ""
            echo "=== OUTPUT-FORMAT ==="
            echo ""
            echo "Schreibe das Ergebnis als reines JSON in /tmp/module_insights.json:"
            echo '{ "insights": [ {'
            echo '  "module_name":   "Name des Moduls (z.B. Chat, Marktplatz, Events)",'
            echo '  "screen_path":   "relativer Pfad (z.B. flutter_app/lib/screens/chat/)",'
            echo '  "insight_type":  "improvement|new_module|vulnerability|inspiration",'
            echo '  "title":         "Kurzer Titel (Deutsch, max 120 Zeichen)",'
            echo '  "description":   "Problem/Nutzen (1-3 Sätze, Deutsch)",'
            echo '  "instruction":   "Präzise Umsetzungs-Anweisung für den Dev-Agenten",'
            echo '  "severity":      "critical|high|medium|low",'
            echo '  "category":      "ux|feature|security|performance|i18n|new_module",'
            echo '  "source":        "analysis|github|research",'
            echo '  "reference_url": "URL (optional, z.B. GitHub-Repo)"'
            echo '} ] }'
            echo ""
            echo "Ziel: 20-40 KONKRETE, umsetzbare Erkenntnisse."
            echo "Keine Trivialitäten ('add more tests'). Echte Schwachstellen mit"
            echo "klarer Anweisung (instruction), die ein Entwickler-Agent direkt"
            echo "umsetzen kann."
            echo ""
            echo "WICHTIG: Ändere KEINEN Code. Erstelle KEINEN Commit. Nur analysieren"
            echo "und /tmp/module_insights.json schreiben."

            if [ -n "$DISMISSED" ]; then
              echo ""
              echo "=== SELBSTLERNEND — NICHT WIEDERHOLEN ==="
              echo "Folgende Erkenntnisse wurden VERWORFEN. Schlage sie NIEMALS erneut vor:"
              echo "$DISMISSED"
            fi
            if [ -n "$ACCEPTED" ]; then
              echo ""
              echo "Folgende Erkenntnisse wurden bereits ANGENOMMEN/umgesetzt:"
              echo "$ACCEPTED"
            fi
          } > /tmp/module_prompt.txt

      - name: Modul-Analyse ausführen
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          claude -p "$(cat /tmp/module_prompt.txt)" \
            --model "$AGENT_MODEL" \
            --output-format stream-json --verbose \
            --dangerously-skip-permissions \
            --max-turns 80 \
            2> /tmp/module_err.log \
            > /tmp/module_output.log
          EXIT=$?
          echo "Exit: $EXIT"
          tail -n 20 /tmp/module_err.log || true

      - name: Erkenntnisse nach Supabase schreiben
        run: |
          set -e
          if [ ! -s /tmp/module_insights.json ]; then
            echo "Keine module_insights.json erzeugt."
            curl -sS -X PATCH \
              "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_module_scan_runs?id=eq.${SCAN_ID}" \
              -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
              -H "Content-Type: application/json" -H "Prefer: return=minimal" \
              -d "{\"status\":\"failed\",\"error\":\"Keine Erkenntnisse erzeugt.\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"
            exit 0
          fi

          SCAN_ID="$SCAN_ID" node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("/tmp/module_insights.json", "utf8");
            let parsed;
            try { parsed = JSON.parse(raw); }
            catch (e) {
              const a = raw.indexOf("{"); const b = raw.lastIndexOf("}");
              parsed = JSON.parse(raw.slice(a, b + 1));
            }
            const types = ["improvement","new_module","vulnerability","inspiration"];
            const sevs  = ["critical","high","medium","low"];
            const cats  = ["ux","feature","security","performance","i18n","new_module"];
            const srcs  = ["analysis","github","research"];
            const rows = (parsed.insights || [])
              .filter(x => x && x.title && x.module_name)
              .slice(0, 60)
              .map(x => ({
                scan_run_id:   process.env.SCAN_ID,
                module_name:   String(x.module_name).slice(0, 100),
                screen_path:   x.screen_path ? String(x.screen_path).slice(0, 300) : null,
                insight_type:  types.includes(x.insight_type) ? x.insight_type : "improvement",
                title:         String(x.title).slice(0, 200),
                description:   x.description ? String(x.description).slice(0, 1000) : "",
                instruction:   x.instruction ? String(x.instruction).slice(0, 2000) : null,
                severity:      sevs.includes(x.severity) ? x.severity : "medium",
                category:      cats.includes(x.category) ? x.category : "feature",
                source:        srcs.includes(x.source) ? x.source : "analysis",
                reference_url: x.reference_url ? String(x.reference_url).slice(0, 500) : null,
              }));
            fs.writeFileSync("/tmp/rows.json", JSON.stringify(rows));
          '

          ROWS="$(cat /tmp/rows.json)"
          COUNT="$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).length))' "$ROWS")"
          echo "Erkenntnisse: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            curl -sS -X POST \
              "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_module_insights" \
              -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
              -H "Content-Type: application/json" -H "Prefer: return=minimal" \
              -d "$ROWS"
          fi

          curl -sS -X PATCH \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_module_scan_runs?id=eq.${SCAN_ID}" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"status\":\"done\",\"insights_count\":${COUNT},\"current_module\":null,\"completed_at\":\"$(date -u +%FT%TZ)\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"

      - name: Status -> failed (bei Fehler)
        if: failure()
        run: |
          curl -sS -X PATCH \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_module_scan_runs?id=eq.${SCAN_ID}" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"status\":\"failed\",\"error\":\"Workflow fehlgeschlagen.\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"
