name: 🔐 Set LiveKit Secrets in Supabase

# One-Shot: Pusht LIVEKIT_SELF_KEY/SECRET aus GitHub Repository Secrets
# in die Supabase Edge Function Environment. Nur manuell triggerbar.
#
# Voraussetzungen (alle als GitHub Repository Secrets unter
# Settings → Secrets and variables → Actions → New repository secret):
#
#   1. SUPABASE_ACCESS_TOKEN  — bereits vorhanden (von supabase.yml)
#   2. SUPABASE_PROJECT_REF   — bereits vorhanden (gyqujitkvymlmgroovch)
#   3. LIVEKIT_SELF_KEY       — NEU: API-Key aus Hostinger livekit.yaml
#                                (z.B. "mensaena-abc123...")
#   4. LIVEKIT_SELF_SECRET    — NEU: API-Secret aus Hostinger livekit.yaml
#
# Optional:
#   5. LIVEKIT_SELF_URL       — Default "wss://livekit.mensaena.de"
#                                Nur setzen wenn andere URL gewuenscht.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-secrets:
    name: 🔐 Push LiveKit-Secrets nach Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve project ref
        id: ref
        env:
          REF_VAR:    ${{ vars.SUPABASE_PROJECT_REF }}
          REF_SECRET: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          raw="${REF_VAR:-$REF_SECRET}"
          if [ -z "$raw" ]; then
            echo "::error::SUPABASE_PROJECT_REF fehlt"
            exit 1
          fi
          ref=$(echo "$raw" | tr -d '[:space:]' | sed -E 's|https?://||; s|\.supabase\.co.*||; s|/.*||' | tr 'A-Z' 'a-z')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Project ref: $ref"

      - name: Validate inputs
        env:
          ACCESS_TOKEN:        ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          LIVEKIT_SELF_KEY:    ${{ secrets.LIVEKIT_SELF_KEY }}
          LIVEKIT_SELF_SECRET: ${{ secrets.LIVEKIT_SELF_SECRET }}
        run: |
          missing=0
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN fehlt"
            missing=1
          fi
          if [ -z "$LIVEKIT_SELF_KEY" ]; then
            echo "::error::LIVEKIT_SELF_KEY fehlt im GitHub Secret. Setze es unter Settings → Secrets → Actions → New repository secret (Wert: aus /docker/livekit*/livekit.yaml auf Hostinger VPS, Format: mensaena-...)"
            missing=1
          fi
          if [ -z "$LIVEKIT_SELF_SECRET" ]; then
            echo "::error::LIVEKIT_SELF_SECRET fehlt im GitHub Secret. Setze es unter Settings → Secrets → Actions → New repository secret (Wert: aus /docker/livekit*/livekit.yaml auf Hostinger VPS, der Wert hinter dem Key)"
            missing=1
          fi
          exit $missing

      - name: Push Secrets nach Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          LIVEKIT_SELF_KEY:      ${{ secrets.LIVEKIT_SELF_KEY }}
          LIVEKIT_SELF_SECRET:   ${{ secrets.LIVEKIT_SELF_SECRET }}
          LIVEKIT_SELF_URL:      ${{ secrets.LIVEKIT_SELF_URL }}
        run: |
          REF="${{ steps.ref.outputs.ref }}"
          URL="${LIVEKIT_SELF_URL:-wss://livekit.mensaena.de}"

          echo "── Setze Secrets fuer Projekt $REF ──"
          supabase secrets set \
            --project-ref "$REF" \
            LIVEKIT_SELF_KEY="$LIVEKIT_SELF_KEY" \
            LIVEKIT_SELF_SECRET="$LIVEKIT_SELF_SECRET" \
            LIVEKIT_SELF_URL="$URL"

          echo ""
          echo "── Auflisten der gesetzten Secrets (nur Namen, keine Werte) ──"
          supabase secrets list --project-ref "$REF" | grep -i livekit || true

      - name: Verify via Diagnose-Endpoint
        run: |
          # Wartet 3s damit Secrets propagieren, dann probe-call
          sleep 3
          REF="${{ steps.ref.outputs.ref }}"
          echo "── Probe-Call ?check=1 ──"
          response=$(curl -sS -X POST \
            "https://${REF}.supabase.co/functions/v1/livekit-token?check=1" \
            -H "Content-Type: application/json" -d '{}')
          echo "Response: $response"
          if echo "$response" | grep -q '"has_key":true' && echo "$response" | grep -q '"has_secret":true'; then
            echo "✅ Secrets erfolgreich gesetzt!"
          else
            echo "::error::Secrets sind noch nicht aktiv. Response: $response"
            exit 1
          fi

      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # ✅ LiveKit-Secrets aktiv

          Die Supabase Edge Function \`livekit-token\` hat jetzt:
          - \`LIVEKIT_SELF_URL\` = wss://livekit.mensaena.de (default)
          - \`LIVEKIT_SELF_KEY\` = mensaena-... (gesetzt)
          - \`LIVEKIT_SELF_SECRET\` = ... (gesetzt)

          ## Nächste Schritte
          1. Warte 5–15 Min bis Shorebird-OTA beim Geraet ankommt
          2. Channel oeffnen → Radio-FAB → LiveRoom connect funktioniert
          3. DM → Phone-FAB → Audio-Call funktioniert

          ## Verifikation
          \`\`\`bash
          curl -X POST 'https://gyqujitkvymlmgroovch.supabase.co/functions/v1/livekit-token?check=1' \\
            -H 'Content-Type: application/json' -d '{}'
          \`\`\`
          Soll zeigen: \`{"has_key":true,"has_secret":true}\`
          EOF
