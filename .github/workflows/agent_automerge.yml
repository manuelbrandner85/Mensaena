name: ✅ Agent Auto-Merge

# ════════════════════════════════════════════════════════════════════════
# Merged Agent-PRs (Branch `agent/*`, Label `agent-automerge`) automatisch –
# ABER NUR wenn das Flutter-CI ("Flutter Android Build") grün ist und kein
# anderer Check fehlgeschlagen ist. So geht niemals nicht-kompilierender
# Code live an die Nutzer.
#
# Der Merge läuft über AGENT_PAT, damit der Push auf main anschließend
# shorebird_patch.yml triggert → OTA-Patch an die App.
#
# Rate-Limit-Härtung: ALLE Lese-Calls (pr list, check-runs, pr view) laufen
# über das GITHUB_TOKEN — das hat einen eigenen, hohen Pro-Repo-Bucket und
# belastet NICHT das User-Limit des PAT-Inhabers. Nur der Merge + der
# Shorebird-Dispatch nutzen AGENT_PAT (Pflicht für die OTA-Kette). Dadurch
# sinkt die PAT-Last auf 2 Calls; zusätzlich greift beim Merge ein Retry mit
# Backoff, falls doch ein kurzzeitiges Secondary-Limit auftritt.
# ════════════════════════════════════════════════════════════════════════

on:
  workflow_run:
    workflows: ["Flutter Android Build"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

env:
  SUPABASE_REF: gyqujitkvymlmgroovch

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'agent/task-')
    steps:
      - name: Auswerten & mergen
        env:
          # Default-Token für gh = GITHUB_TOKEN (hoher Pro-Repo-Bucket, schont
          # das User-Limit). Der PAT wird nur gezielt für Merge + Dispatch
          # per Inline-Override (GH_TOKEN="$PAT" gh …) verwendet.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT: ${{ secrets.AGENT_PAT }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          TASK_ID="${BRANCH#agent/task-}"

          patch_status() {
            curl -sS -X PATCH \
              "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_dev_tasks?id=eq.${TASK_ID}" \
              -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Content-Type: application/json" -H "Prefer: return=minimal" \
              -d "$1" || true
          }

          # 1) Flutter-CI muss grün sein — sonst Selbstheilung (bis MAX Versuche).
          if [ "$CONCLUSION" != "success" ]; then
            echo "Flutter-CI nicht grün ($CONCLUSION)."
            MAX_FIX=3
            ATTEMPTS=$(curl -sS \
              "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_dev_tasks?id=eq.${TASK_ID}&select=ci_attempts" \
              -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);process.stdout.write(String((a[0]&&a[0].ci_attempts)||0))}catch{process.stdout.write("0")}})')
            ATTEMPTS=${ATTEMPTS:-0}
            if [ "$ATTEMPTS" -lt "$MAX_FIX" ]; then
              NEXT=$((ATTEMPTS+1))
              echo "Selbstheilung Versuch ${NEXT}/${MAX_FIX} — Fehler an den Agenten zurückspielen."
              # Fehlgeschlagene Job-Logs holen (gekürzt) — Lese-Call via GITHUB_TOKEN.
              LOG=$(gh run view "$RUN_ID" --repo "${{ github.repository }}" --log-failed 2>/dev/null | tail -c 6000 || echo "")
              BODY=$(LOG="$LOG" NEXT="$NEXT" CI_RUN_URL="$CI_RUN_URL" MAX_FIX="$MAX_FIX" node -e 'console.log(JSON.stringify({ci_attempts:Number(process.env.NEXT),status:"running",ci_status:"failure",ci_run_url:process.env.CI_RUN_URL,error:String(process.env.LOG||"").slice(0,8000),summary:"Selbstheilung Versuch "+process.env.NEXT+"/"+process.env.MAX_FIX+" — CI rot, Agent bessert nach.",updated_at:new Date().toISOString()}))')
              patch_status "$BODY"
              # Fix-Workflow anstoßen (PAT — wie der Shorebird-Dispatch, braucht actions:write).
              GH_TOKEN="$PAT" gh workflow run admin_agent_fix.yml \
                --repo "${{ github.repository }}" --ref main \
                --field task_id="$TASK_ID" \
                && echo "admin_agent_fix.yml dispatcht für ${TASK_ID}" \
                || echo "Dispatch fehlgeschlagen (Token-Rechte?)."
              exit 0
            fi
            echo "Nach ${MAX_FIX} Selbstheilungs-Versuchen weiter rot — aufgeben."
            patch_status "{\"ci_status\":\"failure\",\"ci_run_url\":\"${CI_RUN_URL}\",\"summary\":\"Flutter-CI nach ${MAX_FIX} Selbstheilungs-Versuchen rot — PR bleibt offen zur manuellen Prüfung.\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"
            exit 0
          fi

          # CI grün — im Dashboard sofort sichtbar machen.
          patch_status "{\"ci_status\":\"success\",\"ci_run_url\":\"${CI_RUN_URL}\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"

          # 2) PR zum Branch finden
          PR_NUM=$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" \
                     --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUM" ]; then
            echo "Kein offener PR für $BRANCH — evtl. bereits gemergt."
            exit 0
          fi

          # 2a) Race-Schutz: Der grüne Build galt für HEAD_SHA. Wurde inzwischen
          #     ein neuerer Commit auf den Branch gepusht, ist der aktuelle
          #     Branch-Head NICHT von diesem Build abgedeckt → NICHT mergen.
          #     Der Build des neuen Commits triggert einen eigenen Automerge-Lauf.
          #     (Verhindert, dass ungetesteter Code auf main gelangt — Ursache
          #     des toARGB32-Vorfalls, der main rot zog.)
          CUR_SHA=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" \
                      --json headRefOid --jq '.headRefOid' 2>/dev/null || echo "")
          if [ -n "$CUR_SHA" ] && [ "$CUR_SHA" != "$HEAD_SHA" ]; then
            echo "Branch-Head ($CUR_SHA) ≠ gebauter Commit ($HEAD_SHA) — warte auf den Build des neuen Commits, kein Merge."
            exit 0
          fi

          # 2b) Review-Gate: wenn der Admin "Vor Merge prüfen" gewählt hat
          #     (await_review=true), NICHT automatisch mergen — stattdessen
          #     auf 'awaiting_review' setzen. Der Admin gibt im Dashboard frei.
          AWAIT=$(curl -sS \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_dev_tasks?id=eq.${TASK_ID}&select=await_review" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);process.stdout.write(String(a[0]&&a[0].await_review===true))}catch{process.stdout.write("false")}})')
          if [ "$AWAIT" = "true" ]; then
            echo "Review-Gate aktiv — warte auf manuelle Freigabe."
            patch_status "{\"status\":\"awaiting_review\",\"ci_status\":\"success\",\"ci_run_url\":\"${CI_RUN_URL}\",\"pr_number\":${PR_NUM},\"summary\":\"CI grün — wartet auf deine Freigabe (Diff prüfen, dann mergen).\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"
            exit 0
          fi

          # 3) Kein anderer abgeschlossener Check darf fehlgeschlagen sein
          FAILED=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" \
                     --jq '[.check_runs[] | select(.status=="completed") | select(.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out" or .conclusion=="action_required")] | length')
          if [ "${FAILED:-0}" -gt 0 ]; then
            echo "$FAILED fehlgeschlagene Checks — kein Merge."
            patch_status "{\"summary\":\"Andere CI-Checks fehlgeschlagen — PR bleibt offen.\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"
            exit 0
          fi

          # 4) Squash-Merge via PAT (triggert shorebird_patch.yml auf main).
          #    Retry mit Backoff gegen kurzzeitige Secondary-Rate-Limits.
          echo "Alles grün — merge PR #$PR_NUM"
          MERGED=0
          for attempt in 1 2 3 4; do
            if GH_TOKEN="$PAT" gh pr merge "$PR_NUM" --repo "${{ github.repository }}" \
                 --squash --delete-branch --admin; then
              MERGED=1
              break
            fi
            # Schon gemergt? (z.B. paralleler Lauf) → als Erfolg werten.
            STATE=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" \
                      --json state --jq '.state' 2>/dev/null || echo "")
            if [ "$STATE" = "MERGED" ]; then
              MERGED=1
              break
            fi
            WAIT=$((2 ** attempt))
            echo "Merge-Versuch $attempt fehlgeschlagen (evtl. Rate-Limit) — warte ${WAIT}s…"
            sleep "$WAIT"
          done
          if [ "$MERGED" -ne 1 ]; then
            echo "Merge nach 4 Versuchen nicht möglich — PR bleibt offen."
            patch_status "{\"ci_status\":\"success\",\"ci_run_url\":\"${CI_RUN_URL}\",\"pr_number\":${PR_NUM},\"summary\":\"CI grün, aber Auto-Merge scheiterte (Rate-Limit). PR #$PR_NUM bleibt offen — bitte manuell mergen.\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"
            exit 0
          fi

          # Merge-Commit-SHA für späteren Ein-Tap-Rollback speichern (Read via GITHUB_TOKEN).
          MERGE_SHA=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" \
                        --json mergeCommit --jq '.mergeCommit.oid // empty' || true)

          # 5) OTA sicherstellen: shorebird_patch.yml explizit dispatchen (via PAT).
          # Die push-Pfadfilter greifen nur bei flutter_app/**-Änderungen —
          # dieser Dispatch ist der Safety-Net für alle anderen Fälle.
          # Falls der Token keine actions:write-Berechtigung hat, schlägt das
          # fehl (||true), der normale Push-Trigger ist dann das Backup.
          GH_TOKEN="$PAT" gh workflow run shorebird_patch.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            --field source_branch=main 2>/dev/null || true

          patch_status "{\"status\":\"merged\",\"ci_status\":\"success\",\"merge_commit_sha\":\"${MERGE_SHA}\",\"summary\":\"PR #$PR_NUM gemergt (CI grün). OTA-Auslieferung läuft.\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"

          # ── Auto-Changelog: gemergte Änderung festhalten (für Dashboard) ────
          PR_TITLE=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" \
                       --json title --jq '.title' 2>/dev/null || echo "Godmode-Änderung")
          # Geänderte Dateien (max 60) für den detaillierten Changelog.
          PR_FILES=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" \
                       --json files --jq '[.files[].path] | .[0:60]' 2>/dev/null || echo "[]")
          # Kurz-Zusammenfassung = erste nicht-leere Zeile der PR-Beschreibung.
          PR_SUMMARY=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" \
                       --json body --jq '[.body | split("\n")[] | select(test("\\S"))][0] // ""' 2>/dev/null || echo "")
          CL_BODY=$(TASK_ID="$TASK_ID" PR_TITLE="$PR_TITLE" PR_NUM="$PR_NUM" PR_FILES="$PR_FILES" PR_SUMMARY="$PR_SUMMARY" node -e '
            let files = [];
            try { files = JSON.parse(process.env.PR_FILES || "[]"); } catch (_) { files = []; }
            const summary = String(process.env.PR_SUMMARY || "").replace(/^#+\s*/, "").slice(0, 400) || null;
            console.log(JSON.stringify({
              task_id: process.env.TASK_ID,
              title: String(process.env.PR_TITLE || "Godmode-Änderung").slice(0, 300),
              pr_number: Number(process.env.PR_NUM) || null,
              files: Array.isArray(files) ? files : [],
              summary,
            }));
          ')
          curl -sS -X POST \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/godmode_changelog" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "$CL_BODY" || true

          # ── Phasen-Verkettung ──────────────────────────────────────────────
          # War dieser Task eine Phase eines größeren Auftrags, dispatcht
          # next_phase die nächste Phase (eigener PR/CI/OTA). Bei Einzel-
          # Aufträgen ist das ein harmloser No-Op (chained:false). Service-to-
          # Service über den Service-Role-Key (kein User-JWT im Workflow).
          curl -sS -X POST \
            "https://${SUPABASE_REF}.supabase.co/functions/v1/admin-dev-agent" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"next_phase\",\"task_id\":\"${TASK_ID}\"}" \
            && echo "next_phase angestoßen für ${TASK_ID}" || true
