name: 🤖 Admin Dev Agent

# ════════════════════════════════════════════════════════════════════════
# Wird vom Admin-Dashboard via Edge Function `admin-dev-agent` getriggert
# (workflow_dispatch). Nutzt anthropics/claude-code-action@v1 — die
# offizielle Action, die Branch, Commits, Push und PR-Erstellung intern
# und zuverlässig übernimmt (kein manuelles npm/git/gh nötig).
#
# Auto-Merge übernimmt `agent_automerge.yml` – NUR wenn das Flutter-CI
# ("Flutter Android Build") grün ist. Danach liefert shorebird_patch.yml
# die Dart-Änderung als lautlosen OTA-Patch an die App aus.
#
# Benötigte GitHub Secrets:
#   CLAUDE_CODE_OAUTH_TOKEN    — Claude-Abo-Token (empfohlen) ODER
#   ANTHROPIC_API_KEY          — Anthropic-API-Key. Eines genügt.
#   AGENT_PAT                  — fine-grained PAT (contents:write,
#                                pull-requests:write). Push/PR MÜSSEN
#                                über den PAT laufen, damit das
#                                pull_request-CI (flutter.yml) triggert.
#   SUPABASE_SERVICE_ROLE_KEY  — Statusupdates in admin_dev_tasks
# ════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: 'Aufgabe vom Admin-Dashboard'
        required: true
      task_id:
        description: 'admin_dev_tasks.id (UUID)'
        required: true
      image_urls:
        description: 'JSON-Array mit Screenshot-URLs (optional, für Vision)'
        required: false
        default: '[]'
      model:
        description: 'Optionales Claude-Modell (leer = Action-Default)'
        required: false
        default: ''
      retry_count:
        description: 'Wievielter Versuch (0 = Erstlauf; Watchdog zählt hoch)'
        required: false
        default: '0'

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write  # Pflicht für anthropics/claude-code-action (OIDC-Token)

env:
  SUPABASE_REF: gyqujitkvymlmgroovch
  SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  TASK_ID: ${{ inputs.task_id }}

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (mit PAT, damit PR-CI triggert)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_PAT }}
          # Shallow Checkout: der Agent erstellt einen frischen Branch vom
          # main-Tip + PR — die volle Historie braucht er nicht. fetch-depth:1
          # spart bei großem Repo ~1-2 Min Klon-Zeit.
          fetch-depth: 1

      - name: Status -> running
        env:
          RETRY_COUNT: ${{ inputs.retry_count }}
        run: |
          RC="${RETRY_COUNT:-0}"
          case "$RC" in (*[!0-9]*|'') RC=0;; esac
          curl -sS -X PATCH \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_dev_tasks?id=eq.${TASK_ID}" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"status\":\"running\",\"retry_count\":${RC},\"run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"

      - name: Screenshots herunterladen (Vision)
        env:
          IMGS: ${{ inputs.image_urls }}
        run: |
          # Bilder in einen lokalen Ordner laden. Per .git/info/exclude vom
          # Commit ausgeschlossen, damit der Agent sie NICHT versehentlich
          # mit eincheckt — sie dienen nur als visueller Kontext.
          mkdir -p .godmode_images
          echo ".godmode_images/" >> .git/info/exclude
          COUNT=$(node -e 'const a=JSON.parse(process.env.IMGS||"[]"); process.stdout.write(String(Array.isArray(a)?a.length:0))')
          echo "Bilder: $COUNT"
          [ "$COUNT" = "0" ] && exit 0
          node -e 'const a=JSON.parse(process.env.IMGS||"[]"); a.forEach(u=>console.log(u))' > /tmp/img_urls.txt
          i=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            ext=$(printf '%s' "$url" | sed -E 's/.*\.([a-zA-Z0-9]{1,4})($|\?).*/\1/')
            case "$ext" in jpg|jpeg|png|gif|webp) ;; *) ext=jpg;; esac
            curl -sSL "$url" -o ".godmode_images/screenshot_${i}.${ext}" || true
            i=$((i+1))
          done < /tmp/img_urls.txt
          ls -la .godmode_images/ || true

      # Flutter installieren, damit der Agent `flutter analyze` SELBST ausführen
      # und Symbol-/Compile-Fehler beheben kann, BEVOR ein PR entsteht. Version
      # exakt wie flutter.yml (gepinnt 3.27.x), sonst weichen die Analyzer-
      # Ergebnisse ab. pub get läuft best-effort (analyze braucht die Deps).
      - name: Setup Flutter (Pre-PR analyze)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.x'
      - name: flutter pub get
        working-directory: flutter_app
        run: flutter pub get || true

      - name: Agent ausführen
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.AGENT_PAT }}
          # --max-turns 40 war zu niedrig: komplexere Auftraege liefen ins
          # Limit (error_max_turns) BEVOR ein PR entstand → der Auftrag erreichte
          # die App nie. Run #12 (task 73f174ad) scheiterte genau so: 40 Turns
          # erschoepft, dazu 19 Permission-Denials die Turns verbrannten.
          # bypassPermissions schaltet die Denials ab (isolierte CI-Sandbox mit
          # PAT, kein interaktiver Kontext) — der Agent verschwendet keinen Turn
          # mehr an Genehmigungen und kommt zuverlaessig bis zum PR.
          claude_args: "--max-turns 150 --permission-mode bypassPermissions ${{ inputs.model != '' && format('--model {0}', inputs.model) || '--model claude-opus-4-8' }}"
          prompt: |
            Du bist der Mensaena-Entwicklungs-Agent. Arbeite gründlich und
            high-end. Bei GRÖSSEREN Aufträgen (mehrere Dateien/Datenmodell):
            skizziere ZUERST kurz eine Architektur (betroffene Dateien,
            Datenmodell/Migration, Reihenfolge der Schritte) und setze sie dann
            konsequent um. Kleine Aufträge direkt umsetzen — kein Overhead.

            === AUFGABE ===
            ${{ inputs.instruction }}
            === ENDE AUFGABE ===

            PROMPT-VERSTÄNDNIS — die Aufgabe kommt vom Admin oft wie eine
            Chat-Nachricht: umgangssprachlich, knapp, mit Tippfehlern oder
            Diktier-Fehlern ("eracheunungsbild" = Erscheinungsbild), ohne
            Dateipfade. Das ist OK und erwartet. Deine Pflicht:
            1. Interpretiere WOHLWOLLEND und professionell — erschließe die
               INTENTION (was soll sich für den Nutzer ändern?), nicht den
               Wortlaut. Korrigiere offensichtliche Vertipper stillschweigend.
            2. Finde die betroffenen Stellen selbst (Grep/architecture-map),
               statt Pfade im Auftrag zu erwarten.
            3. Schreibe an den ANFANG der PR-Beschreibung 1-2 Sätze
               "**Verstanden als:** …" — deine professionelle Interpretation
               des Auftrags. So sieht der Admin sofort, ob du ihn richtig
               verstanden hast.
            4. Nur wenn der Auftrag WIRKLICH mehrdeutig ist (zwei plausible,
               gegensätzliche Umsetzungen): wähle die wahrscheinlichere,
               setze sie um und benenne die Alternative kurz im PR-Text.
               NIEMALS wegen Unklarheit einfach nichts tun.

            WICHTIG — Screenshots: Falls im Ordner .godmode_images/ Bilder
            liegen, sieh sie dir ZUERST mit dem Read-Tool an. Diese Bilder
            NIEMALS committen.

            Ablauf (so kurz wie möglich):
            1. Lies CLAUDE.md (Pflichtregeln), docs/godmode/conventions.md
               (echte AppColors/Widgets/APIs + bekannte Stolperfallen UND
               bewährte Patterns) und docs/godmode/architecture-map.md
               (Modul-Struktur, Datenfluss, Cinema-Gating, Auth/Push/i18n-
               Konventionen) + die beteiligten Dateien (gezielt lesen, nicht
               den ganzen Codebase).
            2. Branch erstellen: agent/task-${{ inputs.task_id }}
            3. Änderungen umsetzen. Nutze NUR Symbole, die laut conventions.md
               bzw. per Code-Grep wirklich existieren — niemals raten.
            4. PFLICHT-GATE vor dem Commit (wenn Dart-Dateien geändert):
               Führe `cd flutter_app && flutter analyze` aus. Das CI nutzt
               `--no-fatal-infos`, d. h. **error- UND warning-Zeilen sind fatal**
               (nur `info` ist erlaubt). Behebe JEDE error/warning und führe
               analyze erneut aus, bis KEINE error/warning mehr erscheint.
               Committe NIEMALS mit verbleibenden errors/warnings — genau daran
               sind zuletzt mehrere Aufträge rot geworden (erfundene Symbole wie
               `Color.toARGB32`, `ShimmerSkeleton`, `AppColors.primary`,
               `LucideIcons.euroSign`). Verwende NUR Symbole, die wirklich
               existieren (per Grep im Code verifizieren statt raten).
               Danach die Projekt-Guards
               `python3 scripts/check_stream_limits.py` +
               `python3 scripts/check_ui_supabase.py` +
               `python3 scripts/check_design_i18n.py` grün bekommen (Letzterer
               verbietet emerald/neue hartcodierte Farben und erzwingt i18n-Key-
               Parität). Für jeden neuen `.tr()`-Key sicherstellen, dass er in
               ALLEN 7 Übersetzungs-Dateien existiert. Wenn Tests geändert/ergänzt:
               `flutter test` lokal grün.
            5. SELBST-REVIEW: Lies deinen kompletten Diff (`git diff`) noch einmal
               kritisch durch wie ein Code-Reviewer: Logikfehler, vergessene
               Edge-Cases (null/leer/Fehlerzustand), Regelverstöße (i18n, Streams,
               Design, Secrets), unnötige/überflüssige Änderungen. Bessere nach,
               BEVOR du den PR erstellst.
               DESIGN-GATE (nur bei UI/Design-Aufgaben): vergleiche den neuen/
               geänderten Screen konkret mit 2-3 bestehenden Premium-Screens
               (z. B. Onboarding, Profil, Settings) — gleiche Spacing-Rhythmik,
               gleiche Typo-Hierarchie, gleiche Card-/Button-Sprache, gleiche
               Motion-Sparsamkeit? Wirkt er GENAUSO hochwertig, oder fällt er
               dagegen ab? Wenn er abfällt: konkret nachbessern, nicht nur
               abnicken.
            6. Commit + Push + PR gegen main erstellen.

            Effizienz-Regeln:
            - Lese NUR Dateien, die du wirklich brauchst (Glob/Grep statt
              blind alle Files lesen).
            - Verändere NIEMALS pubspec.yaml Version ohne explizite Anweisung.
            - Für Breaking-Changes: füge [mandatory] in die Commit-Message ein.

            Verbindliche Regeln (CLAUDE.md):
            - i18n: JEDER neue UI-String via .tr() in ALLEN 7 JSON-Dateien
              (flutter_app/assets/translations/{de,en,it,es,fr,tr,ru}.json).
            - Supabase-Streams: IMMER .limit() + autoDispose.
            - Design: primary/teal, KEINE emerald-Farben.
            - NIEMALS Secrets/Tokens/Keys in den Code.
            - Tests: für NEUE Repositories/Services/reine Dart-Logik passende
              Unit-Tests unter flutter_app/test/ anlegen (reine Logik, KEINE
              Netzwerk-/Supabase-Calls; ggf. mocken). Reine UI-Tweaks brauchen keine.

            Spezialisierung — die AUFGABE beginnt oft mit einem Kategorie-Präfix
            aus der Dashboard-Chipleiste, GENAU einer dieser Strings:
            "[UI/UX]", "[Feature]", "[Bugfix]", "[Performance]",
            "[i18n/Translations]", "[Database]", "[Security]", "[Configuration]"
            (oder ein selbstgelernter eigener Kategorie-Name). Erkennst du eines
            dieser Präfixe, ist DAS deine PRIMÄRE Fachbrille (nicht raten) — die
            anderen Regeln unten gelten trotzdem zusätzlich, wo relevant. Kein
            Präfix → Brille anhand der Aufgabe selbst wählen.

            - "[UI/UX]": Ziel elegant, professionell, subtil, viel Weißraum. Nur
              AppColors-Tokens (kein hartes Color(0x…)), konsistente Cards/
              Buttons/Abstände, dezente Animationen. PFLICHT: rufe VOR dem
              Schreiben von Code das Skill-Tool mit "impeccable" auf (Modus je
              nach Aufgabe: polish/audit/animate/typeset/colorize — passend
              wählen) UND bei Animationen/Transitions zusätzlich
              "emil-design-eng". Wende die dortigen Prinzipien tatsächlich an,
              orientiere dich zusätzlich an bestehenden Premium-Screens
              (Onboarding/Profil/Settings).
            - "[Security]": RLS für jeden neuen Tabellenzugriff, Eingaben
              validieren, keine fremden Nutzerdaten exponieren, Secrets nur via
              Secrets.
            - "[Performance]": Rebuilds minimieren (const, Keys), Streams mit
              .limit() + autoDispose, keine N+1-Queries, Bilder cachen.
            - "[i18n/Translations]": jeder String via .tr() in allen 7 JSON-
              Dateien, natürliche Sprache je Land (keine Wort-für-Wort-
              Maschinenübersetzung).
            - "[Database]": Migration idempotent (IF NOT EXISTS/OR REPLACE),
              eindeutiger 14-stelliger Versions-Timestamp NEUER als die letzte
              Datei in supabase/migrations/ (Guard
              `check_migration_timestamps.py` prüft das im PR), RLS
              standardmäßig mitdenken.
            - "[Configuration]": CI/Workflow-Änderungen sparsam und mit
              Kommentar, warum — dieser Bereich betrifft die gesamte Pipeline
              für alle künftigen Aufträge.

            Auto-Doku: Wenn du die Architektur spürbar änderst (neues Modul, neue
            Tabelle/Edge-Function, neuer Pipeline-Schritt), aktualisiere die
            passende Doku knapp mit (CLAUDE.md bzw. docs/godmode/*) — im selben PR.

            Ressourcen-Katalog (High-End):
            - Lies docs/godmode/resources.md. BEVORZUGE die dort gelisteten
              KOSTENLOSEN APIs (möglichst ohne Key) und bewährten Open-Source-
              Pakete, statt Funktionen von Grund auf neu zu erfinden. API-Keys
              nur via Secrets, niemals im Code.
            - Bei unbekannten Paketen/APIs ZUERST die AKTUELLE Doku recherchieren
              (WebFetch/WebSearch, pub.dev), dann integrieren — keine veralteten
              Annahmen.
            - Neue NATIVE Dependencies brauchen einen Versions-Bump (kein OTA);
              reine Dart-Pakete sind unkritisch. Im Zweifel ohne neue Dependency
              lösen.
            - Du darfst GitHub nach Referenz-Implementierungen/Snippets suchen
              (WebSearch + Code-Suche). Bevorzuge permissive Lizenzen
              (MIT/Apache/BSD); übernimm KEINEN GPL/AGPL-Code 1:1. Nenne genutzte
              Quellen kurz im PR-Text.

      # ── V1: Agent-Ergebnis ehrlich auswerten ────────────────────────────────
      # Die claude-code-action beendet sich auch bei API-Fehlern mit Exit 0 —
      # im Ausführungsprotokoll steht dann aber is_error:true (real passiert
      # am 2026-07-07: Fehler nach ~0,5 s, num_turns:1, Kosten $0 → Abo-Limit).
      # Ohne diesen Schritt wurde so ein Lauf als "no_changes" verbucht und der
      # Auftrag verpuffte still. Hier wird der Fehler erkannt + der Fehlertext
      # extrahiert, damit die Status-Schritte unten korrekt routen können.
      - name: Agent-Ergebnis auswerten
        id: agent_result
        if: always()
        run: |
          OUT="$RUNNER_TEMP/claude-execution-output.json"
          IS_ERROR=false
          ERR_TEXT=""
          if [ -f "$OUT" ]; then
            RESULT=$(node -e '
              const fs = require("fs");
              try {
                const raw = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                const msgs = Array.isArray(raw) ? raw : [raw];
                const res = [...msgs].reverse().find(m => m && m.type === "result");
                if (!res) { console.log(JSON.stringify({err:false, text:""})); process.exit(0); }
                const err = res.is_error === true;
                // Fehlertext: result-String, sonst Fehler-Objekte, sonst Kennzahlen.
                let text = typeof res.result === "string" ? res.result : "";
                if (!text && res.error) text = String(res.error);
                if (err && !text) text = `API-Fehler im Turn ${res.num_turns} nach ${res.duration_ms} ms (Kosten $${res.total_cost_usd ?? 0}) — vermutlich Nutzungslimit/Overload.`;
                console.log(JSON.stringify({err, text: text.slice(0, 600)}));
              } catch (e) {
                console.log(JSON.stringify({err:false, text:""}));
              }
            ' "$OUT")
            IS_ERROR=$(printf '%s' "$RESULT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).err)))')
            ERR_TEXT=$(printf '%s' "$RESULT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).text))')
          else
            echo "Kein Ausführungsprotokoll gefunden ($OUT) — überspringe Auswertung."
          fi
          echo "is_error=$IS_ERROR" >> "$GITHUB_OUTPUT"
          {
            echo "error_text<<__EOT__"
            printf '%s\n' "$ERR_TEXT"
            echo "__EOT__"
          } >> "$GITHUB_OUTPUT"
          echo "Agent-Ergebnis: is_error=$IS_ERROR ${ERR_TEXT:+— $ERR_TEXT}"

      # ── Fallback: Commit + Push + PR garantieren ────────────────────────────
      # Der Agent (claude-code-action) committet seine Änderungen per GitHub-API
      # (github-actions[bot], Commit-Signing) DIREKT auf den Branch
      # agent/task-<id> — der LOKALE Working-Tree bleibt dabei sauber. Er
      # erstellt aber nicht zuverlässig einen PR. Ergebnis ohne Fallback:
      # Branch mit fertiger Arbeit, aber KEIN PR → Pipeline meldet no_changes →
      # Auftrag "verpufft", obwohl die Arbeit fertig auf dem Branch liegt.
      #
      # Dieser Schritt macht die Pipeline deterministisch. Drei Fälle:
      #   A) PR existiert schon              → nichts tun.
      #   B) Remote-Branch ist vor main      → PR erstellen (der Normalfall:
      #      (Agent hat per API committet)     Arbeit liegt auf origin/<branch>).
      #   C) Nur lokale (uncommittete)       → committen, pushen, PR erstellen.
      #      Änderungen im Working-Tree
      - name: Fallback — Commit + Push + PR sicherstellen
        # Bei einem Agent-API-Fehler KEINEN Fallback-PR aus eventuell halb
        # fertiger Arbeit bauen — der Auftrag geht stattdessen in den Retry.
        if: success() && steps.agent_result.outputs.is_error != 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          BRANCH: agent/task-${{ inputs.task_id }}
          REPO: ${{ github.repository }}
          INSTR: ${{ inputs.instruction }}
        run: |
          set +e
          PR_TITLE=$(printf '%s' "$INSTR" | head -c 70 | tr '\n' ' ')
          PR_BODY="Automatisch erstellter Godmode-Auftrag (task ${{ inputs.task_id }}). Vom Fallback-Schritt erzeugt, da der Agent den PR nicht selbst angelegt hat."

          create_pr() {
            gh pr create --repo "$REPO" --base main --head "$BRANCH" \
              --title "godmode: ${PR_TITLE}" --body "$PR_BODY" \
              && echo "✅ Fallback-PR erstellt." \
              || echo "PR-Erstellung fehlgeschlagen (evtl. existiert er schon)."
          }

          # A) PR schon da? → fertig.
          EXISTING=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
                       --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING existiert bereits — kein Fallback nötig."
            exit 0
          fi

          # B) Hat der Agent per API schon einen Remote-Branch mit Commits
          #    erzeugt? (claude-code-action → github-actions[bot]). Das ist der
          #    Normalfall — die fertige Arbeit liegt auf origin/$BRANCH.
          git fetch origin main "$BRANCH" -q 2>/dev/null
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            AHEAD_REMOTE=$(git rev-list --count "origin/main..origin/$BRANCH" 2>/dev/null || echo 0)
            if [ "${AHEAD_REMOTE:-0}" -gt 0 ]; then
              echo "Remote-Branch $BRANCH ist $AHEAD_REMOTE Commit(s) vor main — erstelle PR."
              create_pr
              exit 0
            fi
          fi

          # C) Sonst: evtl. nur lokale (uncommittete) Änderungen → committen.
          git checkout -B "$BRANCH" || exit 0
          CHANGED=0
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="claude[bot]" \
                -c user.email="claude[bot]@users.noreply.github.com" \
                commit -m "feat(godmode): $(printf '%s' "$INSTR" | head -c 80 | tr '\n' ' ')" && CHANGED=1
          fi
          AHEAD_LOCAL=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 0)
          if [ "$CHANGED" -eq 0 ] && [ "${AHEAD_LOCAL:-0}" -eq 0 ]; then
            echo "Wirklich keine Änderungen — echtes no_changes."
            exit 0
          fi
          git push -u origin "$BRANCH" --force-with-lease || git push -u origin "$BRANCH" --force
          create_pr

      - name: Screenshots/Goldens als Artefakt sichern (best-effort)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: godmode-screenshots-${{ inputs.task_id }}
          path: |
            flutter_app/test/golden/**/*.png
            flutter_app/test/**/failures/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: PR ermitteln
        id: findpr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AGENT_PAT }}
          script: |
            const taskId = process.env.TASK_ID;
            const branch = `agent/task-${taskId}`;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const match = prs.find(p => p.head.ref === branch);
            if (!match) {
              core.setOutput('found', 'false');
              return;
            }
            core.setOutput('found', 'true');
            core.setOutput('number', String(match.number));
            core.setOutput('url', match.html_url);

      - name: Status -> pr_open
        if: steps.findpr.outputs.found == 'true'
        run: |
          curl -sS -X PATCH \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_dev_tasks?id=eq.${TASK_ID}" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"status\":\"pr_open\",\"pr_url\":\"${{ steps.findpr.outputs.url }}\",\"pr_number\":${{ steps.findpr.outputs.number }},\"updated_at\":\"$(date -u +%FT%TZ)\"}"

      # V1/V2: Agent-API-Fehler ohne PR → NICHT als "no_changes" tarnen.
      # retry_count < 3 → status 'error_retry' (der Task-Watchdog dispatcht
      # den Auftrag automatisch neu, Abo-Limits resetten sich mit der Zeit).
      # retry_count >= 3 → endgültig 'failed' mit echtem Fehlertext.
      - name: Status -> error_retry / failed (Agent-API-Fehler)
        if: steps.findpr.outputs.found == 'false' && steps.agent_result.outputs.is_error == 'true'
        env:
          RETRY_COUNT: ${{ inputs.retry_count }}
          ERR_TEXT: ${{ steps.agent_result.outputs.error_text }}
        run: |
          RC="${RETRY_COUNT:-0}"
          case "$RC" in (*[!0-9]*|'') RC=0;; esac
          ERR_JSON=$(printf '%s' "$ERR_TEXT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.stringify(s||"Agent-API-Fehler (kein Fehlertext)")))')
          if [ "$RC" -lt 3 ]; then
            echo "API-Fehler, Versuch $RC/3 — Auftrag geht in error_retry (Watchdog wiederholt)."
            curl -sS -X PATCH \
              "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_dev_tasks?id=eq.${TASK_ID}" \
              -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
              -H "Content-Type: application/json" -H "Prefer: return=minimal" \
              -d "{\"status\":\"error_retry\",\"error\":${ERR_JSON},\"updated_at\":\"$(date -u +%FT%TZ)\"}"
          else
            echo "API-Fehler und Retry-Budget (3) erschöpft — endgültig failed."
            curl -sS -X PATCH \
              "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_dev_tasks?id=eq.${TASK_ID}" \
              -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
              -H "Content-Type: application/json" -H "Prefer: return=minimal" \
              -d "{\"status\":\"failed\",\"error\":${ERR_JSON},\"updated_at\":\"$(date -u +%FT%TZ)\"}"
          fi

      - name: Status -> no_changes
        if: steps.findpr.outputs.found == 'false' && steps.agent_result.outputs.is_error != 'true'
        run: |
          curl -sS -X PATCH \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_dev_tasks?id=eq.${TASK_ID}" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"status\":\"no_changes\",\"summary\":\"Der Agent hat keine Änderungen vorgenommen.\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"

      - name: Status -> failed (bei Fehler)
        if: failure()
        run: |
          curl -sS -X PATCH \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_dev_tasks?id=eq.${TASK_ID}" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"status\":\"failed\",\"error\":\"Workflow fehlgeschlagen. Siehe Action-Log.\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"
