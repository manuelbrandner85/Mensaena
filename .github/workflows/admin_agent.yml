name: 🤖 Admin Dev Agent

# ════════════════════════════════════════════════════════════════════════
# Wird vom Admin-Dashboard via Edge Function `admin-dev-agent` getriggert
# (workflow_dispatch). Nutzt anthropics/claude-code-action@v1 — die
# offizielle Action, die Branch, Commits, Push und PR-Erstellung intern
# und zuverlässig übernimmt (kein manuelles npm/git/gh nötig).
#
# Auto-Merge übernimmt `agent_automerge.yml` – NUR wenn das Flutter-CI
# ("Flutter Android Build") grün ist. Danach liefert shorebird_patch.yml
# die Dart-Änderung als lautlosen OTA-Patch an die App aus.
#
# Benötigte GitHub Secrets:
#   CLAUDE_CODE_OAUTH_TOKEN    — Claude-Abo-Token (empfohlen) ODER
#   ANTHROPIC_API_KEY          — Anthropic-API-Key. Eines genügt.
#   AGENT_PAT                  — fine-grained PAT (contents:write,
#                                pull-requests:write). Push/PR MÜSSEN
#                                über den PAT laufen, damit das
#                                pull_request-CI (flutter.yml) triggert.
#   SUPABASE_SERVICE_ROLE_KEY  — Statusupdates in admin_dev_tasks
# ════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: 'Aufgabe vom Admin-Dashboard'
        required: true
      task_id:
        description: 'admin_dev_tasks.id (UUID)'
        required: true
      image_urls:
        description: 'JSON-Array mit Screenshot-URLs (optional, für Vision)'
        required: false
        default: '[]'

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write  # Pflicht für anthropics/claude-code-action (OIDC-Token)

env:
  SUPABASE_REF: gyqujitkvymlmgroovch
  SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  TASK_ID: ${{ inputs.task_id }}

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (mit PAT, damit PR-CI triggert)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_PAT }}
          # Shallow Checkout: der Agent erstellt einen frischen Branch vom
          # main-Tip + PR — die volle Historie braucht er nicht. fetch-depth:1
          # spart bei großem Repo ~1-2 Min Klon-Zeit.
          fetch-depth: 1

      - name: Status -> running
        run: |
          curl -sS -X PATCH \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_dev_tasks?id=eq.${TASK_ID}" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"status\":\"running\",\"run_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"

      - name: Screenshots herunterladen (Vision)
        env:
          IMGS: ${{ inputs.image_urls }}
        run: |
          # Bilder in einen lokalen Ordner laden. Per .git/info/exclude vom
          # Commit ausgeschlossen, damit der Agent sie NICHT versehentlich
          # mit eincheckt — sie dienen nur als visueller Kontext.
          mkdir -p .godmode_images
          echo ".godmode_images/" >> .git/info/exclude
          COUNT=$(node -e 'const a=JSON.parse(process.env.IMGS||"[]"); process.stdout.write(String(Array.isArray(a)?a.length:0))')
          echo "Bilder: $COUNT"
          [ "$COUNT" = "0" ] && exit 0
          node -e 'const a=JSON.parse(process.env.IMGS||"[]"); a.forEach(u=>console.log(u))' > /tmp/img_urls.txt
          i=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            ext=$(printf '%s' "$url" | sed -E 's/.*\.([a-zA-Z0-9]{1,4})($|\?).*/\1/')
            case "$ext" in jpg|jpeg|png|gif|webp) ;; *) ext=jpg;; esac
            curl -sSL "$url" -o ".godmode_images/screenshot_${i}.${ext}" || true
            i=$((i+1))
          done < /tmp/img_urls.txt
          ls -la .godmode_images/ || true

      - name: Agent ausführen
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.AGENT_PAT }}
          # --max-turns 40 war zu niedrig: komplexere Auftraege liefen ins
          # Limit (error_max_turns) BEVOR ein PR entstand → der Auftrag erreichte
          # die App nie. Run #12 (task 73f174ad) scheiterte genau so: 40 Turns
          # erschoepft, dazu 19 Permission-Denials die Turns verbrannten.
          # bypassPermissions schaltet die Denials ab (isolierte CI-Sandbox mit
          # PAT, kein interaktiver Kontext) — der Agent verschwendet keinen Turn
          # mehr an Genehmigungen und kommt zuverlaessig bis zum PR.
          claude_args: "--max-turns 150 --permission-mode bypassPermissions"
          prompt: |
            Du bist der Mensaena-Entwicklungs-Agent. Setze die Aufgabe DIREKT
            und EFFIZIENT um — ohne langen Planungs-Overhead.

            === AUFGABE ===
            ${{ inputs.instruction }}
            === ENDE AUFGABE ===

            WICHTIG — Screenshots: Falls im Ordner .godmode_images/ Bilder
            liegen, sieh sie dir ZUERST mit dem Read-Tool an. Diese Bilder
            NIEMALS committen.

            Ablauf (so kurz wie möglich):
            1. Lies CLAUDE.md (Pflichtregeln) + beteiligte Dateien (gezielt lesen,
               nicht den ganzen Codebase).
            2. Branch erstellen: agent/task-${{ inputs.task_id }}
            3. Änderungen umsetzen.
            4. flutter analyze prüfen (nur wenn Dart-Dateien geändert).
            5. Commit + Push + PR gegen main erstellen.

            Effizienz-Regeln:
            - Lese NUR Dateien, die du wirklich brauchst (Glob/Grep statt
              blind alle Files lesen).
            - Verändere NIEMALS pubspec.yaml Version ohne explizite Anweisung.
            - Für Breaking-Changes: füge [mandatory] in die Commit-Message ein.

            Verbindliche Regeln (CLAUDE.md):
            - i18n: JEDER neue UI-String via .tr() in ALLEN 7 JSON-Dateien
              (flutter_app/assets/translations/{de,en,it,es,fr,tr,ru}.json).
            - Supabase-Streams: IMMER .limit() + autoDispose.
            - Design: primary/teal, KEINE emerald-Farben.
            - NIEMALS Secrets/Tokens/Keys in den Code.

      - name: Screenshots/Goldens als Artefakt sichern (best-effort)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: godmode-screenshots-${{ inputs.task_id }}
          path: |
            flutter_app/test/golden/**/*.png
            flutter_app/test/**/failures/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: PR ermitteln
        id: findpr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AGENT_PAT }}
          script: |
            const taskId = process.env.TASK_ID;
            const branch = `agent/task-${taskId}`;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const match = prs.find(p => p.head.ref === branch);
            if (!match) {
              core.setOutput('found', 'false');
              return;
            }
            core.setOutput('found', 'true');
            core.setOutput('number', String(match.number));
            core.setOutput('url', match.html_url);

      - name: Status -> pr_open
        if: steps.findpr.outputs.found == 'true'
        run: |
          curl -sS -X PATCH \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_dev_tasks?id=eq.${TASK_ID}" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"status\":\"pr_open\",\"pr_url\":\"${{ steps.findpr.outputs.url }}\",\"pr_number\":${{ steps.findpr.outputs.number }},\"updated_at\":\"$(date -u +%FT%TZ)\"}"

      - name: Status -> no_changes
        if: steps.findpr.outputs.found == 'false'
        run: |
          curl -sS -X PATCH \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_dev_tasks?id=eq.${TASK_ID}" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"status\":\"no_changes\",\"summary\":\"Der Agent hat keine Änderungen vorgenommen.\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"

      - name: Status -> failed (bei Fehler)
        if: failure()
        run: |
          curl -sS -X PATCH \
            "https://${SUPABASE_REF}.supabase.co/rest/v1/admin_dev_tasks?id=eq.${TASK_ID}" \
            -H "apikey: ${SRK}" -H "Authorization: Bearer ${SRK}" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d "{\"status\":\"failed\",\"error\":\"Workflow fehlgeschlagen. Siehe Action-Log.\",\"updated_at\":\"$(date -u +%FT%TZ)\"}"
