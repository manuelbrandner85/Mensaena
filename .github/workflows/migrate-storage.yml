# Einmal-Werkzeug (Phase 2): Storage-Dateien von huaqld nach gyquj kopieren.
#
# pg_dump (Phase 1) hat nur die Bucket-/Objekt-METADATEN bewegt, NICHT die
# echten Dateien. Dieser Workflow kopiert die echten S3-Objekte (Avatare,
# Sprachnachrichten, alle Bilder) ueber die S3-kompatiblen Supabase-Endpunkte
# mit rclone. NICHT-DESTRUKTIV: 'rclone copy' kopiert nur, loescht nie.
#
# VORAUSSETZUNG -- diese GitHub-Secrets anlegen (Repo -> Settings -> Secrets):
#   SRC_S3_ACCESS_KEY_ID      (huaqld: Dashboard -> Project Settings -> Storage
#   SRC_S3_SECRET_ACCESS_KEY               -> S3 Access Keys -> New access key)
#   DST_S3_ACCESS_KEY_ID      (gyquj: ebenso)
#   DST_S3_SECRET_ACCESS_KEY
#
# Endpunkte/Regionen sind bekannt und hardcoded:
#   huaqld -> https://huaqldjkgyosefzfhjnf.supabase.co/storage/v1/s3 (eu-central-1)
#   gyquj  -> https://gyqujitkvymlmgroovch.supabase.co/storage/v1/s3 (eu-west-1)
#
# Die Ziel-Buckets existieren bereits (Phase 1 hat storage.buckets eingespielt).

name: 'Storage-Migration huaqld -> gyquj (Phase 2)'

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Zum Bestaetigen exakt COPY eintippen'
        required: true
        default: ''

jobs:
  copy-storage:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'COPY' }}
    env:
      # --- Quelle (huaqld) ---
      RCLONE_CONFIG_SRC_TYPE: s3
      RCLONE_CONFIG_SRC_PROVIDER: Other
      RCLONE_CONFIG_SRC_ENV_AUTH: 'false'
      RCLONE_CONFIG_SRC_ACCESS_KEY_ID: ${{ secrets.SRC_S3_ACCESS_KEY_ID }}
      RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY: ${{ secrets.SRC_S3_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_SRC_ENDPOINT: https://huaqldjkgyosefzfhjnf.supabase.co/storage/v1/s3
      RCLONE_CONFIG_SRC_REGION: eu-central-1
      RCLONE_CONFIG_SRC_FORCE_PATH_STYLE: 'true'
      RCLONE_CONFIG_SRC_NO_CHECK_BUCKET: 'true'
      # --- Ziel (gyquj) ---
      RCLONE_CONFIG_DST_TYPE: s3
      RCLONE_CONFIG_DST_PROVIDER: Other
      RCLONE_CONFIG_DST_ENV_AUTH: 'false'
      RCLONE_CONFIG_DST_ACCESS_KEY_ID: ${{ secrets.DST_S3_ACCESS_KEY_ID }}
      RCLONE_CONFIG_DST_SECRET_ACCESS_KEY: ${{ secrets.DST_S3_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_DST_ENDPOINT: https://gyqujitkvymlmgroovch.supabase.co/storage/v1/s3
      RCLONE_CONFIG_DST_REGION: eu-west-1
      RCLONE_CONFIG_DST_FORCE_PATH_STYLE: 'true'
      RCLONE_CONFIG_DST_NO_CHECK_BUCKET: 'true'
      BUCKETS: >-
        avatars board-images chat-images chat-voice-messages covers
        crisis-images event-images event-photos group-images knowledge-images
        marketplace-images organization-images post-images public voicemails
    steps:
      - name: rclone installieren
        run: |
          set -e
          sudo -v ; curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Secrets pruefen
        run: |
          set -e
          for v in RCLONE_CONFIG_SRC_ACCESS_KEY_ID RCLONE_CONFIG_SRC_SECRET_ACCESS_KEY \
                   RCLONE_CONFIG_DST_ACCESS_KEY_ID RCLONE_CONFIG_DST_SECRET_ACCESS_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret fuer $v fehlt - bitte S3-Access-Keys beider Projekte anlegen."
              exit 1
            fi
          done
          echo "Alle 4 S3-Secrets vorhanden."

      - name: Buckets kopieren (nicht-destruktiv)
        run: |
          set -u
          fail=0
          for b in $BUCKETS; do
            echo "==================== Bucket: $b ===================="
            if rclone copy "src:$b" "dst:$b" \
                 --transfers=8 --checkers=16 --fast-list \
                 --s3-no-check-bucket --retries 3 --low-level-retries 10 \
                 --stats=10s --stats-one-line; then
              # Zaehlung zur Kontrolle (Quelle vs. Ziel).
              s=$(rclone size "src:$b" 2>/dev/null | tr '\n' ' ' || echo '?')
              d=$(rclone size "dst:$b" 2>/dev/null | tr '\n' ' ' || echo '?')
              echo "OK $b -> Quelle: $s | Ziel: $d"
            else
              echo "::warning::Bucket $b nicht kopiert (existiert evtl. nicht / leer / Rechte)."
              fail=$((fail+1))
            fi
          done
          echo "Fertig. Buckets mit Problemen: $fail"
          # Job bleibt gruen; einzelne fehlende/leere Buckets sind kein Abbruch.

      - name: Gesamt-Verifikation
        run: |
          echo "=== Objekt-Summen pro Bucket (Quelle -> Ziel) ==="
          for b in $BUCKETS; do
            s=$(rclone size "src:$b" 2>/dev/null | sed -n '1p' || echo '?')
            d=$(rclone size "dst:$b" 2>/dev/null | sed -n '1p' || echo '?')
            printf '%-26s Quelle: %-22s Ziel: %s\n' "$b" "$s" "$d"
          done
