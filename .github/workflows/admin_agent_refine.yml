name: 🔁 Admin Dev Agent — Nachbesserung

# ════════════════════════════════════════════════════════════════════════
# Wird von der Edge Function admin-dev-agent (action='refine') getriggert,
# wenn der Admin an einem OFFENEN Godmode-PR (pr_open / awaiting_review) per
# Chat eine Folge-Anweisung schickt. Der Agent checkt den BESTEHENDEN Branch
# agent/task-<id> aus, setzt die zusätzliche Anweisung um und pusht auf
# denselben Branch → flutter.yml läuft erneut → agent_automerge wertet neu aus.
# ════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'admin_dev_tasks.id (UUID)'
        required: true
      instruction:
        description: 'Folge-Anweisung des Admins'
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

env:
  SUPABASE_REF: gyqujitkvymlmgroovch
  SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  TASK_ID: ${{ inputs.task_id }}
  BRANCH: agent/task-${{ inputs.task_id }}

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout des Agent-Branches (mit PAT, damit der Re-Push CI triggert)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_PAT }}
          ref: agent/task-${{ inputs.task_id }}
          fetch-depth: 0

      - name: Agent — Folge-Anweisung umsetzen
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.AGENT_PAT }}
          claude_args: "--max-turns 150 --permission-mode bypassPermissions --model claude-opus-4-8"
          prompt: |
            Du bist der Mensaena-Entwicklungs-Agent und arbeitest auf dem
            BESTEHENDEN Branch agent/task-${{ inputs.task_id }} (bereits
            ausgecheckt) — der zugehörige PR ist schon offen.

            Setze diese ZUSÄTZLICHE Änderung/Anpassung um:
            === ANWEISUNG ===
            ${{ inputs.instruction }}
            === ENDE ===

            Regeln:
            - Committe auf DENSELBEN Branch und pushe. KEINEN neuen Branch,
              KEINEN neuen PR (der PR existiert bereits).
            - Vor dem Push (bei Dart-Änderungen): `flutter analyze` +
              `python3 scripts/check_stream_limits.py` +
              `python3 scripts/check_ui_supabase.py` ausführen, Verstöße beheben.
            - i18n: neue UI-Strings in alle 7 JSON-Dateien. Design primary/teal.
              Keine Secrets im Code. pubspec-Version NICHT ändern.

      - name: Fallback — Änderungen committen + pushen
        if: success()
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
        run: |
          set +e
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="claude[bot]" \
                -c user.email="claude[bot]@users.noreply.github.com" \
                commit -m "feat(godmode): Nachbesserung (task ${TASK_ID})"
            git push origin "HEAD:${BRANCH}" --force-with-lease || git push origin "HEAD:${BRANCH}"
          else
            echo "Keine lokalen Änderungen — Agent hat vermutlich selbst gepusht."
          fi
